var DATA = [{"num":"01","title":"如何分辨真假沉香？先看这 3 点","category":"真假","summary":"成分、构造、证书三点一起看，单看颜色、沉水、香味都容易被骗。","minutes":6,"img":"images/article01_cover.jpg","text":"如何分辨真假沉香？先看这 3 点 成分、构造、证书三点一起看，单看颜色、沉水、香味都容易被骗。 真假 沉香真假不能只靠一个办法判断。最可靠的是三点一起看：成分、构造、证书。单看颜色、单看沉水、单闻香味，都容易被骗。这篇把三点讲透，文末有一张收藏卡，买之前对照着看。 先说结论：真沉香必须同时满足两条 按 LY/T 2904-2017《沉香》，天然沉香的定义有两个条件，缺一不可：具备沉香源植物组织原本的构造；所分泌物在结香过程中自然生成、无外来添加。 注油、压缩、人工重组都会改变木质部原始构造，显微镜下看得出来。第一眼很“漂亮”的料，反而要多看一眼。 第一点：看成分，沉香四醇是红线 正规检测会测几个核心指标，其中最关键的是沉香四醇含量需 ≥0.1%，这是判定真结香的关键红线之一。再配合醇浸出物、挥发油含量和密度测定，判断等级和沉水与否。 天然沉香的色酮类物质与倍半萜类物质比值应小于 1，人工沉香则大于 1。看报告先看这三行，再看检测依据是不是 LY/T 2904-2017。没有成分数据的“保证是真的”，等于没说。 第二点：看构造，纹理和油线会说话 不用仪器，肉眼也能先筛一遍：油线自然不规则，深浅不一，有断续；木质纹理还在，油脂和木质交错；颜色棕褐为主，深浅过渡自然。太整齐、太黑、像画上去的油线，通体漆黑发亮的颜色，都要警惕泡油和染色。 手串还要看珠孔：孔口干净、内壁能看到木质是正常的；孔口有胶、油渍、黑色残留，基本就是动过手脚。 第三点：查证书，一物一证才算数 证书只看两件事。第一，证书编号能不能和你手里这件对应上：照片、克重、编号三者一致，才叫一物一证。批量通用证书、货证分离，是行业常见套路。第二，出报告的机构有没有 CMA（中国计量认证）和 CNAS 认可。CMA 证明报告有法律效力，CNAS 证明能力符合国际标准。 说清楚边界：检测证书只做材质鉴定，确认是不是瑞香科沉香属，不评定产地、等级、沉水、野生还是种植、商业价值。产区和等级要结合溯源和实物看，第三方不背这个。 三个最常见的坑，别踩 沉水 = 真的？不对。沉水只说明密度大，压缩料、注油料也能沉水。浮水也不等于假，很多好沉香是沉水浮。 越黑越好？不对。太黑发亮反而可能是泡油或染色。天然沉香颜色深浅不一。 有证书 = 一定真？不对。要看证书是不是一物一证、机构有没有 CMA、编号能不能查到。套证比没证更会骗人。"},{"num":"02","title":"泡油、注胶、压缩、染色：5 种造假手段一张图认清","category":"真假","summary":"造假手段就这几种，认清一次，以后看到都能警觉。","minutes":6,"img":"images/article02_cover.jpg","text":"泡油、注胶、压缩、染色：5 种造假手段一张图认清 造假手段就这几种，认清一次，以后看到都能警觉。 真假 沉香造假翻来覆去就是那几种：泡油、注胶、压缩、染色、高压。了解它们是怎么做的，比死记硬背“真品长什么样”更管用，因为造假的破绽都藏在工艺里。 泡油：最常见，香味刺鼻是破绽 把白木或低油料泡进香精、精油里，表面看起来油汪汪的，闻起来很香。但泡油的香味是浮在表面的，单一、刺鼻、不分层次，放一段时间香味就跑光了。 怎么看：油线发黑发亮，像抹了一层油；用纸巾擦，纸巾上会留下油渍和颜色；上手摸完手上黏糊糊的。天然沉香的油是长在木质里的，擦不下来。 注胶、注油：增重，也增沉水率 往木头里注入树脂、胶水或重油，让轻料变重、浮水变沉水，冒充高油料。这是最坑人的手段之一，因为它连“沉水”这个指标都伪造了。 怎么看：切面或珠孔处能看到胶质反光；闻起来有化学胶味；密度异常均匀，天然沉香的密度每颗珠子都不一样。 压缩：碎料压成“整料” 把沉香粉末、碎料加胶高压压成块，再切成珠子或雕件。看起来是整块料，其实是重组料，木质部原始构造已经被彻底破坏。 怎么看：纹理断裂不连贯，没有天然的油线走向；断面能看到颗粒感；价格明显低于同规格整料。显微镜下构造破坏一目了然。 染色：白木刷黑，冒充高油 用黑色染料把浅色白木染深，冒充油脂丰富的老料。染色的料颜色发死，深浅没有过渡，表面像刷了漆。 怎么看：用酒精棉片轻擦，棉片上会沾色；泡水后水会变色；木纹被颜色盖住，看不到油脂和木质交错的层次。 高压：速成结香，香韵单薄 通过人工打孔、注菌、高压等手段加速结香，几个月就出料。这类料名义上是“沉香”，但油脂积累时间太短，香韵单薄，上炉后层次少、留香短。 买之前问清楚结香方式和年份，说不清、含糊其辞的，先别买。结香时间是沉香品质绕不开的一环，速成的料卖不出老料的价，也留不住香。"},{"num":"03","title":"证书怎么看？CMA、CNAS、一物一证","category":"真假","summary":"证书不是护身符，要看编号能不能对上实物，机构有没有资质。","minutes":5,"img":"images/article03_cover.jpg","text":"证书怎么看？CMA、CNAS、一物一证 证书不是护身符，要看编号能不能对上实物，机构有没有资质。 真假 很多人买沉香，看到有证书就放心了。其实证书的水分很大：套证、批量证、野鸡机构出的证，比比皆是。这篇教你三分钟看懂一张证书。 先看机构：CMA 是底线 CMA 是中国计量认证，有 CMA 章的报告才有法律效力。CNAS 是实验室认可，证明这家机构的能力达到国际标准。两者都有最好，至少要有 CMA。 没有 CMA 章的“证书”，说白了就是一张打印纸。可以在国家认监委官网查机构资质，查不到的机构，报告不用再看了。 再看编号：一物一证才算数 正规证书是“一物一证”：证书上的照片、克重、编号，必须和你手里这件一一对应。照片对不上、克重差得远、编号查不到，都是套证的信号。 最常见的套路是“批量通用证书”：一张证对应一批货，甚至所有货共用一张证。这种证等于没证，因为它证明不了你手里这件。 最后看内容：三个硬指标 看报告先看三行：沉香四醇含量（≥0.1%）、醇浸出物、挥发油。再看检测依据是不是 LY/T 2904-2017。只写“经检测为沉香”却没有任何数据的报告，参考价值很低。 注意报告上的样品描述：送检的是“沉香手串”还是“木质样品”？描述越具体越可信，越含糊越要小心。 证书的边界：它能证明什么，不能证明什么 检测证书只做材质鉴定，确认是不是瑞香科沉香属。它不评定产地、等级、沉水、野生还是种植、商业价值。 所以“有证书的越南芽庄”这个说法，证书只证明了“是沉香”，“越南芽庄”那部分是商家说的，需要溯源来佐证，不能拿证书当产地证明。"},{"num":"04","title":"沉水就一定是真的吗？密度和真假的关系","category":"真假","summary":"沉水只说明密度大，压缩料、注油料也能沉水。","minutes":5,"img":"images/article04_cover.jpg","text":"沉水就一定是真的吗？密度和真假的关系 沉水只说明密度大，压缩料、注油料也能沉水。 真假 “沉水就是好沉香”是最流行的误解之一。沉水只说明一件事：密度大于水。它和真假、和品质，都不是一回事。 沉香为什么会沉水 沉香的木质本身密度小于水，沉水是因为油脂积累多了，整体密度超过了水。油脂越多、越密，越容易沉。所以沉水确实和油脂含量有关，但只是相关，不是等同。 天然沉香按密度分三档：沉水（全沉）、沉水浮（半沉半浮）、浮水。很多好沉香是沉水浮，香韵、油脂都不差，只是不沉。 能沉水的假货，一抓一大把 压缩料、注胶料、注油料都能沉水，因为胶和重油的密度本来就大。拿沉水当唯一标准，等于给造假开绿灯。 反过来，浮水也不等于假。白木香、轻油料、新结香的料很多都是浮水，香韵清雅，适合入门和日常品香。 密度应该怎么用 密度是参考指标之一，要和成分、构造、证书一起看。正确的使用方式是：先确认是真的（成分 + 构造 + 证书），再用密度辅助判断油脂丰富程度和等级。 LY/T 3223-2020《沉香质量分级》里，密度是分级指标之一，但不是唯一指标。分级还要综合醇浸出物、挥发油、沉香四醇。"},{"num":"05","title":"闻香辨真假：室温香、上炉香、凉意、甜味怎么听","category":"真假","summary":"刺鼻、单一甜香要小心；室温淡、上炉层次多是正常的。","minutes":6,"img":"images/article05_cover.jpg","text":"闻香辨真假：室温香、上炉香、凉意、甜味怎么听 刺鼻、单一甜香要小心；室温淡、上炉层次多是正常的。 真假 闻香是分辨沉香最直接也最容易被误导的办法。直接，是因为香韵骗不了人；容易误导，是因为“好闻”和“真”是两回事。香精比天然沉香“好闻”得多。 室温香：淡才是正常的 天然沉香在室温下香味很淡，凑近才能闻到，凉意、甜意若有若无。常温下香气冲鼻、满屋飘香的，大概率是泡过油或加了香精。 闻室温香的方法：把料放在鼻下 5 厘米，轻轻闻，不要深吸。天然沉香的香是沉的、稳的，不冲、不辣。 上炉香：层次是试金石 上电熏炉加热后，天然沉香的香韵会分层次出来：前调清凉、中调甜醇、尾调木香悠长，而且随温度变化而变化。泡油料、香精料上炉后香味单一、发闷，温度一高就糊味、化学味。 建议温度从低往高试：120 度、150 度、180 度各闻一次。天然沉香在不同温度下香韵不同，这是香精模仿不来的。 凉意和甜味：产区不同，表现不同 惠安系（越南、柬埔寨、海南等）凉意和甜意比较明显，清甜带凉；星洲系（印尼、马来等）更醇厚，带药香和木香。没有哪种更好，只是风格不同。 奇楠的凉意最突出，入口生津感强，但市面上大部分“奇楠”都不是奇楠，凉意也可能是薄荷脑之类的添加物做出来的。凉意要和成分检测一起看。 闻香的三个提醒 第一，鼻子会疲劳。连续闻几件之后灵敏度下降，闻一件、歇一会儿再闻下一件，中间闻闻自己的手背或清水重置一下。 第二，闻香不能单独定真假。它是很好的辅助手段，但最终还是要回到成分、构造、证书三点。 第三，多闻真品。闻过足够多的真沉香之后，假货的化学味、单一甜香会变得很明显。经验是最好的老师。"},{"num":"06","title":"手串真假自查：纹理、油线、珠孔、重量、气味 5 步","category":"真假","summary":"手串造假最多，5 步逐项自查，单看重量和颜色都容易被骗。","minutes":6,"img":"images/article06_cover.jpg","text":"手串真假自查：纹理、油线、珠孔、重量、气味 5 步 手串造假最多，5 步逐项自查，单看重量和颜色都容易被骗。 真假 手串是最常见的沉香消费品，也是造假最多的品类：泡油、注胶、压缩、染色，几乎都冲着手串来。这 5 步按顺序查一遍，大部分问题料都能筛出来。记住：自查是初筛，不是最终结论，最后还是要看检测报告。 第一步：看纹理和油线 天然沉香的油线自然不规则，深浅不一，有断续，木质纹理还在，油脂和木质交错生长。每一颗珠子的纹理都不一样，整串珠子看起来有变化。 要警惕的是：油线太整齐、太黑，像画上去的；整串珠子纹理几乎一模一样；表面像刷了一层漆，木纹被盖住了。这些多半是泡油、染色或压缩料。 第二步：看珠孔，动手脚最爱藏在这里 珠孔是手串最容易露破绽的地方。正常的珠孔孔口干净，内壁能看到木质颜色，孔道顺直。用强光手电照一下孔口和内壁，看得更清楚。 孔口有胶质反光、黑色残留、油渍，或者孔内壁发黑发亮，基本就是注胶或泡油。压缩料的珠孔内壁常能看到颗粒感，木纹是断的。 第三步：称重量，只做参考 重量和油脂含量有关，但跨度很大：同样 8mm、108 颗的手串，天然料从十几克到三十多克都有可能，具体看产区、油脂和结香程度。所以克重只能横向对比同规格、同产区的料，单看克重没有意义。 更要小心的是，注胶、注油、压缩都会增重，“压手”不等于“油多”。拿重量当唯一标准，等于给造假开绿灯。 第四步：闻气味，淡和层次是关键 室温下把手串放在鼻下轻轻闻，天然沉香香味很淡，凑近才闻得到，凉意、甜意若有若无。用手搓热几颗珠子再闻，香味会出来一点，但依然不冲、不辣。 常温下香气冲鼻、满屋飘香，或者香味单一发甜、带化学味的，大概率泡过油或加了香精。天然沉香的香是沉的、稳的，不会刺鼻。 第五步：查证书和溯源 正规的手串应该有一物一证：证书上的照片、克重、编号和你手里这串一一对应，出报告的机构有 CMA 资质。批量通用证书、货证分离，等于没证。 再问溯源：产地、批次、结香方式能不能说清？说不清、含糊其辞的，先别买。溯源说得清的商家，不怕你问。 两个常见误区 越重越好？不对。注胶、压缩都能增重，重量只说明密度，不说明真假和品质。 越黑越好？不对。太黑发亮反而可能是泡油或染色。天然沉香颜色深浅不一，棕褐为主，过渡自然。"},{"num":"07","title":"精油真假：颜色、挂壁、留香、检测报告怎么对","category":"真假","summary":"精油看不见木头，造假更容易，颜色、挂壁、留香、报告四点一起看。","minutes":6,"img":"images/article07_cover.jpg","text":"精油真假：颜色、挂壁、留香、检测报告怎么对 精油看不见木头，造假更容易，颜色、挂壁、留香、报告四点一起看。 真假 精油是沉香里最难凭肉眼判断的品类：看不见木头、摸不到纹理，颜色和气味都能调。这篇讲四点：颜色、挂壁、留香、检测报告，四点一起看，单看任何一点都容易被骗。 先看颜色：深浅不代表好坏 天然沉香精油的颜色从浅黄、金黄到深褐都有，具体看原料产区、油脂含量和蒸馏方式。同一批油颜色基本一致，但不同批次之间有深浅差异是正常的。 要警惕的是：颜色像墨汁一样漆黑，或者鲜艳得不自然；不同批次颜色分毫不差，像调出来的。颜色只能辅助判断，单看颜色定不了真假。 再看挂壁和质地 把瓶子轻轻倾斜，天然沉香精油比较黏稠，流动慢，会在瓶壁上留下一层薄薄的油膜，慢慢滑落。滴一滴在纸上，油点边缘清晰，不会像水一样迅速散开。 稀得像水、流动很快、完全不挂壁的，要怀疑掺了溶剂或基础油。但黏稠度也和蒸馏方式、温度有关，冬天稠、夏天稀，不能只看这一个指标。 闻留香：层次和时间是试金石 在手腕内侧滴一点点，天然沉香精油的香韵会分层次出来：前调清凉、中调甜醇、尾调木香悠长，而且几个小时内香韵一直在变。留香时间长，几个小时后还能闻到尾调。 合成香精调出来的油香味单一，闻起来“很香”但没有变化，留香要么很快跑光，要么一直一个味道。带化学味、酒精味、刺鼻感的，直接警惕。 对检测报告：批次必须对得上 精油的检测一般是 GC-MS 成分分析，看特征成分谱。关键点是：报告上的批次号，必须和你手里这瓶的批次号一致。拿一批次的报告卖所有批次的油，等于没报告。 再看机构有没有 CMA 或 CNAS 资质，看报告上有没有具体的成分数据。只写“经检测为沉香精油”却没有任何数据的报告，参考价值很低。 常见的掺兑手段 掺基础油：用无味的植物油稀释，成本立刻降下来，香味变淡、挂壁变差。掺合成香精：用化学合成的沉香气味物质调香，闻起来像，但成分谱一测就露馅。 混便宜油：用低价产区或低油料的油冒充高价产区的油。这种最难分辨，只能靠成分检测和溯源。买之前问清原料产地和蒸馏方式，说不清的先别买。 买之前问清楚三件事 原料是什么产区、什么年份的料？蒸馏方式是水蒸馏还是其他？这一批有没有检测报告，批次号能不能对上？ 三件事都答得清楚的商家，基本靠谱；含糊其辞、只会说“保证纯天然”的，先别买。"},{"num":"08","title":"线香、香粉真假：看配料表、闻燃烧味、看灰","category":"真假","summary":"线香香粉最容易掺假：掺木粉、加香精、加助燃剂，三点筛一遍。","minutes":5,"img":"images/article08_cover.jpg","text":"线香、香粉真假：看配料表、闻燃烧味、看灰 线香香粉最容易掺假：掺木粉、加香精、加助燃剂，三点筛一遍。 真假 线香和香粉是入门品香最常见的形式，也是最容易掺假的：原料磨成粉之后，肉眼根本看不出来掺了什么。这篇讲三点：看配料表、闻燃烧味、看灰。 看配料表：成分越简单越好 正规线香的配料很简单：沉香粉 + 天然黏合剂（楠木皮粉或榆树皮粉），有的会加少量中药材粉。配料表里出现香精、助燃剂、化学黏合剂、色素的，直接警惕。 没有配料表、只写“纯天然沉香”的，要问商家要配料说明。说不清配料的，先别买。配料含糊，是掺假最常见的遮羞布。 看外观和手感 天然沉香线香颜色是自然的棕褐色，深浅有变化，表面略带木质纹理，不会过于均匀。香粉颜色也是棕褐色，粉末细腻均匀，没有明显杂色颗粒。 颜色过于鲜艳、发红发黑，或者表面像刷了漆的，要怀疑染色。线香一碰就断、粉末粗糙带杂质的，工艺和原料都有问题。 点燃闻燃烧味 点燃后闻：天然沉香线香的燃烧味干净、柔和，有层次，烟不大，不呛鼻不辣眼。香韵会随着燃烧慢慢变化，不会一直一个味道。 燃烧时烟大、呛鼻、辣眼，或者香味单一发甜、带化学味的，大概率加了香精或助燃剂。好的线香烧完后，房间里留下的应该是淡淡的木香，不是刺鼻的甜味。 看灰：能辅助，不能单独定真假 天然沉香线香的灰一般是灰白色，细腻松散，轻轻一碰就散。灰的颜色发黑、发硬、结块，或者有油腻感的，要怀疑加了杂质。 提醒一句：“香灰不断、灰能弯曲不掉”是很多商家宣传的卖点，但这主要和黏合剂、密度有关，不能单独证明是真沉香。看灰只是辅助手段。 香粉单独怎么看 香粉没有线香的燃烧过程，判断主要靠颜色、上炉香和手感。天然沉香粉颜色棕褐均匀，粉末细腻，捏在手里干燥松散，没有结块。颜色发白、发灰，或者颗粒粗细不一、混着杂色颗粒的，要怀疑掺了杂木粉或滑石粉。 上炉试香：取少量香粉放在隔片上低温加热，天然沉香粉出香干净、有层次，凉意甜意随温度变化。香味单一、发闷、带化学味，或者加热后有焦糊味的，大概率掺了香精或杂木粉。香粉受潮结块、发霉的不要用，存的时候注意密封干燥。 掺假的常见手法 掺杂木粉：用普通木粉冒充沉香粉，成本低，香味淡，靠加香精补香。掺滑石粉、碳酸钙增重：粉末发白，手感滑腻，烧完灰发白发硬。 加香精调香：闻起来很香，但燃烧味单一、化学感重。加硝酸钾之类的助燃剂：容易点燃、烧得快，但烟大呛鼻。 买线香先问这几句 原料是哪个产区的沉香？沉香粉占比多少？配料除了沉香粉和黏合剂还有什么？有没有检测报告？ 答得清楚的商家不怕问；只会说“老料”“纯天然”却答不出配料的，先别买。"},{"num":"09","title":"奇楠真假：为什么市面上大部分“奇楠”都不是奇楠","category":"真假","summary":"奇楠产量少、价格高，冒充的也多，凉意和软质地都能造假。","minutes":6,"img":"images/article09_cover.jpg","text":"奇楠真假：为什么市面上大部分“奇楠”都不是奇楠 奇楠产量少、价格高，冒充的也多，凉意和软质地都能造假。 真假 奇楠是沉香中的特殊品类，产量少、价格高。正因为贵，冒充的也多：普通沉香冒充、泡油软化、香精做凉意，手段层出不穷。这篇讲清奇楠和普通沉香到底差在哪，以及怎么初步分辨。 奇楠和普通沉香，到底差在哪 奇楠和普通沉香是同一类植物（瑞香科沉香属）的产物，区别在结香方式和成分：奇楠的油脂含量更高，质地柔软，2-(2-苯乙基）色酮类成分突出，香韵凉意明显，入口有生津感。 T/DBCX 010-2025《奇楠沉香鉴定及质量分级》对奇楠的鉴定和分级有明确指标。买奇楠之前，先确认报告是不是按这个标准出的。 为什么假奇楠这么多 一是价差大：真奇楠按克卖，价格是普通沉香的数倍甚至数十倍，造假利润高。二是消费者了解少：很多人只听过“奇楠凉、软、香”，不知道具体标准，给了冒充可乘之机。 三是产量确实少：真奇楠可遇不可求，市场上流通的“奇楠”数量远超实际产量，多出来的那些，来源自己想。 常见的冒充手法 普通沉香冒充：把油脂丰富的普通沉香直接叫奇楠卖，价格翻几倍。泡油软化：把普通沉香泡油泡软，冒充奇楠的柔软质地。 香精做凉意：加薄荷脑、冰片之类的物质做凉意，闻起来凉，但凉得发冲、不自然，和奇楠的沉稳凉意完全不同。注胶增重：往料里注胶，增重冒充高油奇楠。 怎么初步分辨 质地：真奇楠质地柔软，指甲能掐出印子，切面油润。但泡油的普通沉香也能变软，软不是唯一标准。 香韵：真奇楠室温下就有明显凉意，凉得沉稳、持久，上炉后层次丰富。薄荷脑做的凉意冲、薄、短，闻久了发腻。 油线：真奇楠油线密集，油脂和木质交错，颜色深浅有过渡。油线太整齐、太黑、像画上去的，要警惕。 最终还是要靠检测：按 T/DBCX 010-2025 出具的报告，看特征成分数据。没有报告的“奇楠”，不要按奇楠的价格买。 买奇楠之前必须确认的事 报告是不是按 T/DBCX 010-2025 出的？机构有没有 CMA 资质？报告上的样品信息和实物能不能对上？ 价格明显低于行情的“奇楠”，基本不是奇楠。不要轻信“野生”“老料”这类说法，野生奇楠受 CITES 附录 II 管制，买卖需要合法手续，没有手续的所谓野生奇楠，本身就是问题。 一句话结论 市面上大部分“奇楠”都不是奇楠。买之前先看报告，没有报告就不要按奇楠的价格付钱。真奇楠不怕检测，怕检测的都不是真奇楠。"},{"num":"10","title":"买到假货怎么办？复检、退货、保留证据全流程","category":"真假","summary":"别慌也别急着吵，按流程走：保留证据 → 复检 → 协商 → 投诉。","minutes":6,"img":"images/article10_cover.jpg","text":"买到假货怎么办？复检、退货、保留证据全流程 别慌也别急着吵，按流程走：保留证据 → 复检 → 协商 → 投诉。 真假 买到假沉香，先别慌，也别急着跟商家吵。吵赢了拿不到钱，吵输了还丢证据。正确的顺序是：保留证据 → 复检 → 拿着报告协商 → 协商不成走平台和监管。这篇把全流程讲清楚。 第一步：先别动，保留证据 东西先别用、别盘、别改动，保持原样。手串别上手盘，精油别开封再用，包装、吊牌、附带的证书都留着。 证据清单：订单截图、付款记录、和商家的聊天记录（特别是商家承诺“保真”“一物一证”的部分）、商品页面截图、收到的实物照片、商家提供的证书。聊天记录不要删除，平台外的聊天也要截图备份。 第二步：复检，拿到书面结论 把东西送到有 CMA 资质的检测机构复检，检测依据 LY/T 2904-2017。复检费用一般先由你垫付，如果确认是假货，这笔费用可以在维权时一并主张。 注意：检测结论只针对材质，确认是不是沉香属。报告上会写明样品信息，送检时确认样品描述和你手里的东西一致。拿到书面报告之前，不要轻易下结论。 第三步：拿着报告协商退货 拿着复检报告联系商家，要求退货退款。沟通尽量在平台内进行，留好记录。按消费者权益保护法，经营者有欺诈行为的，消费者可以要求退一赔三。 协商时把诉求说清楚：退货、退款、赔偿复检费用。不要接受“换一件”这种方案，换来的很可能还是同一批货。 第四步：协商不成，走平台和监管 平台购买的，申请平台客服介入，提交复检报告和聊天记录。平台一般会按规则处理，证据充分的情况下，退款成功率不低。 平台处理不满意，或者在平台外购买的，可以拨打 12315 向市场监管部门投诉举报，提交订单、付款记录、复检报告。金额较大的，也可以考虑向消费者协会或通过法律途径解决。本文是流程参考，具体处理以平台规则和相关部门的答复为准。 哪些情况维权比较难 没有订单、没有付款记录、没有聊天记录，东西从哪买的都说不清，维权很难。地摊、展会、朋友圈私下交易没有留痕的，也很难。 东西已经用过、改动过，商家会说“是你自己弄坏的”。时间拖得太久，超过平台售后期的，平台介入的难度也会变大。所以发现问题要尽快行动。 下次买之前，先做这几件事 买之前确认一物一证：证书照片、克重、编号和实物一致，机构有 CMA。问清溯源：产地、批次、结香方式。保留所有记录：订单、付款、聊天、证书，从买的那一刻就留着。 记住：买沉香最便宜的保险，就是买之前的 5 分钟核对。真假鉴别的方法，见本 App 文章 01 和 03。"},{"num":"11","title":"惠安系 vs 星洲系：一次讲透","category":"产区","summary":"沉香分两大体系：惠安系清甜凉意，星洲系醇厚药香，先分清再选。","minutes":6,"img":"images/article11_cover.jpg","text":"惠安系 vs 星洲系：一次讲透 沉香分两大体系：惠安系清甜凉意，星洲系醇厚药香，先分清再选。 产区 买沉香之前，先分清两大体系：惠安系和星洲系。这是行业里很常用的分法，一头是中南半岛和中国华南，一头是东南亚群岛。香韵、油脂、用途都不一样，选错体系，再贵的料也不合你的口味。 先说清楚：这是一种行业分法，不是植物学分类 惠安系和星洲系是贸易和品香圈里的习惯分法，按产区和香韵风格划分，不是植物学的正式分类。两个体系的沉香树同属瑞香科沉香属，物种有重叠，香韵也有交叉，边界不是死的。 惠安系主要包括越南、柬埔寨、老挝、缅甸、泰国，以及中国的海南、广东、广西、云南、福建。星洲系主要包括印尼、马来西亚、文莱、巴布亚新几内亚。记住这个地理分界，再往下看就清楚了。 惠安系：清甜凉意，花香蜜韵 惠安系的香韵以清甜、凉意、花香、蜜韵为主。室温下香味清雅，上炉后层次分明，前调凉、中调甜、尾调干净。越南芽庄、柬埔寨菩萨奇、海南沉香都是这个路子。 油脂上，惠安系的油线相对细腻，颜色棕褐为主，深浅过渡自然。适合喜欢清雅香韵、日常品香和熏香的人。 星洲系：醇厚药香，浓郁悠长 星洲系的香韵以醇厚、药香、木香、乳香为主。香味浓郁饱满，留香时间长，上炉后香韵厚重绵长。印尼加里曼丹、马来西亚、文莱都是这个风格。 油脂上，星洲系的油脂往往更丰富，颜色偏深，密度较大。适合喜欢浓郁香韵、做手串和雕件的人。 一张表看清差别 香韵是核心的差别：惠安系清、星洲系厚。其次是油脂和颜色：惠安系细腻、星洲系浓重。用途上，惠安系多用于品香熏香，星洲系多用于手串雕件，但这只是常见情况，不是硬性规定。 价格上，两个体系内部跨度都很大，不能简单说哪个贵。顶级的惠安系和顶级的星洲系都不便宜，入门级的两者也都有。价格看的是具体那块料的油脂、香韵和稀缺程度，不是体系本身。 怎么选：先看用途，再看口味 日常品香、熏香，喜欢清雅凉意的，先看惠安系。做手串、喜欢浓郁厚重的，先看星洲系。预算有限想入门，两个体系都有性价比不错的选择，比如老挝料和部分印尼料。 最重要的是亲自闻。香韵是主观感受，别人说的“好闻”不等于你闻着好闻。条件允许的话，两种体系的碎料各买一点，上炉对比一次，比看十篇文章管用。 提醒：产区名字不能当真假证明 “芽庄”“加里曼丹”这些产区名，市场上借用的很多。检测证书只证明材质是沉香属，不证明产地。产区要靠溯源：产地、批次、结香方式能不能说清。说不清的，先别买。 另外，缅甸、泰国这些地方的料，香韵介于两个体系之间，很难硬归到某一边。遇到这种料，按实际香韵判断，别纠结它属于哪个体系。"},{"num":"12","title":"越南芽庄：清甜凉意，热门高价产区","category":"产区","summary":"芽庄是惠安系的代表，清甜凉意，名气大，冒充的也多。","minutes":6,"img":"images/article12_cover.jpg","text":"越南芽庄：清甜凉意，热门高价产区 芽庄是惠安系的代表，清甜凉意，名气大，冒充的也多。 产区 芽庄在越南中部沿海，是惠安系里名气很大的产区。清甜凉意、花香明显，是很多人心中沉香的“标准味道”。正因为名气大，价格高，市面上借用“芽庄”这个名字的料也特别多。 芽庄在哪，香韵什么样 芽庄是越南庆和省的沿海城市，属于惠安系产区。芽庄沉香的香韵以清甜、凉意、花香为主，室温下清雅，上炉后层次分明，前调凉、尾调甜，留香干净。 油脂上，芽庄料的油线细腻自然，颜色棕褐，深浅过渡自然。老料油脂丰富，密度较大；新料相对轻，香韵清淡一些。 为什么名气这么大 芽庄沉香在历史上就是贡品级别的香材，古代通过海上贸易进入中国，被文人、宫廷使用，名气是一代代传下来的。加上香韵确实清雅，符合多数人的口味，口碑越传越广。 名气大也带来一个问题：价格里有一部分是“名字”的溢价。同样的香韵和油脂，挂上芽庄的名字，价格能高不少。买之前想清楚，你买的是料子还是名字。 为什么贵 一是老料少：芽庄的老结香料经过多年采伐，存量越来越少。二是需求大：名气在那，买的人多。三是品牌溢价：产区名字本身就值钱。 价格跨度很大：入门级的芽庄碎料和顶级的老料，价格能差十倍以上。不要看到“芽庄”两个字就觉得贵，也不要看到便宜的“芽庄”就觉得捡漏。 芽庄的种植料和野生料 芽庄的野生沉香经过多年采伐，存量很少，而且受保护。市面上的芽庄料绝大多数是种植料：人工种植的沉香树，经过结香、采收、加工，品质稳定，溯源清楚。 种植料不是假货。种植和野生是两种来源，不是真假的区分。好的种植料香韵、油脂都不差。遇到“野生芽庄”，要问合法手续，没有手续的所谓野生料，本身就是问题。 买芽庄料要注意什么 第一，产区名不能当真假证明。检测证书只证明材质是沉香属，不证明产地是芽庄。商家说“芽庄”，要问溯源：产地、批次、结香方式能不能说清。 第二，价格明显低于行情的“芽庄”，基本不是芽庄。便宜的芽庄料，要么是其他产区冒充，要么是品质很差的边角料。 第三，亲自闻。芽庄的招牌是清甜凉意，如果闻着发闷、发甜、带化学味，不管贴什么产区名，都先别买。 适合什么人 喜欢清雅香韵、日常品香熏香的人，芽庄是不错的选择。预算充足、追求经典惠安系风格的人，也可以从芽庄入门。 预算有限的话，不必非买芽庄。老挝、柬埔寨的料香韵接近，价格亲民很多，入门体验不差。"},{"num":"13","title":"越南富森红土：醇厚，为什么贵","category":"产区","summary":"富森红土料在红土里埋藏多年，香韵醇厚甜凉，存量少所以贵。","minutes":6,"img":"images/article13_cover.jpg","text":"越南富森红土：醇厚，为什么贵 富森红土料在红土里埋藏多年，香韵醇厚甜凉，存量少所以贵。 产区 富森在越南中部，红土沉香是这里的招牌。树倒了之后埋进红土里，经过多年的土壤作用，木质部分慢慢腐去，留下油脂丰富的部分，香韵醇厚甜凉，层次丰富。因为形成条件特殊，存量很少，价格也高。 富森在哪，红土料是怎么形成的 富森是越南中部的一个地区，以红土著称。沉香树倒下后埋进红土，经过雨水、微生物和土壤矿物质的长期作用，木质纤维慢慢分解，油脂部分保留下来，形成红土沉香。 这个过程需要很多年，而且不是每块埋进土里的料都能成材。土质、湿度、埋藏时间，缺一不可。所以红土料的存量一直很少。 香韵什么样 富森红土的香韵以醇厚、甜凉为主，带一点土质的沉稳感。室温下香味沉稳，上炉后层次丰富，前调甜、尾调醇，留香时间长。 和芽庄的清甜凉意比，富森红土更厚重、更沉稳。喜欢清雅的人可能觉得它太浓，喜欢醇厚的人会觉得它刚刚好。风格不同，没有高低。 土沉、倒架、水沉有什么区别 土沉是树倒了埋进土里形成的，香韵醇厚甜凉，带土质的沉稳感。倒架是树倒了之后在地面自然醇化，香韵干净清甜。水沉是从水里打捞或在水边形成的，香韵清凉。三种方式没有高低，只有风格不同。 买之前问清楚形成方式，商家应该说得清。说不清形成方式、只会说“老料”的，先别买。形成方式和价格有关，含糊其辞往往是为了抬价。 为什么贵 一是存量少：形成条件苛刻，能成材的料不多。二是时间长：埋藏需要很多年，等不起。三是香韵独特：醇厚甜凉的风格在惠安系里比较少见，喜欢的人愿意为它付钱。 价格跨度同样很大。普通的红土碎料和顶级的老红土料，价格能差很多倍。不要只看“红土”两个字就下结论，要看具体的油脂、香韵和品相。 红土料和染色怎么分 红土料的颜色是土壤作用形成的，红褐色自然，深浅不一，颜色长在木质里。染色的料颜色浮在表面，发死，没有过渡，酒精棉片轻擦会沾色。 闻香也能辅助判断：红土料的香韵醇厚甜凉，有层次；染色料往往香味单一，或者带化学味。最终还是要看成分检测和溯源。 买富森红土要注意什么 第一，问清楚是土沉还是其他。土沉、倒架、水沉是不同的形成方式，价格和香韵都不一样，商家应该说得清。 第二，价格明显低于行情的“红土”，要警惕染色冒充。红土料存量少，捡漏的概率很低。 第三，亲自闻。醇厚甜凉是招牌，闻着发闷、发冲、带化学味的，先别买。"},{"num":"14","title":"缅甸沉香：香韵、油脂、价格区间","category":"产区","summary":"缅甸料介于惠安系和星洲系之间，清甜带药香，价格跨度大。","minutes":5,"img":"images/article14_cover.jpg","text":"缅甸沉香：香韵、油脂、价格区间 缅甸料介于惠安系和星洲系之间，清甜带药香，价格跨度大。 产区 缅甸沉香的香韵介于惠安系和星洲系之间：清甜里带一点药香，凉意中等，醇厚度比越南料高，比印尼料低。这种“中间”风格，让它在两个体系之间都有人喜欢。 缅甸沉香的香韵 缅甸料的香韵以清甜、药香为主，凉意中等。室温下清雅，上炉后甜味和药香交替出来，层次感不错。喜欢惠安系的清甜、又想要一点厚重感的人，常常会看上缅甸料。 不同地区的缅甸料香韵有差异，北部和南部的料风格不完全一样。买之前亲自闻，别只看产区名。 油脂和外观 缅甸料的油脂比较丰富，颜色偏深，棕褐到深褐都有。油线自然，密度中等偏大，好料能沉水浮或沉水。 外观上，缅甸料的木质纹理清楚，油脂和木质交错。太黑发亮、油线像画上去的，要警惕泡油和染色。 价格怎么看 缅甸料的价格跨度很大：入门级的碎料不贵，顶级的老料也不便宜。总体上，同规格下缅甸料的价格通常低于芽庄、富森这些名气大的产区，高于一些入门级产区。 价格看的是具体那块料的油脂、香韵和品相，不是产区名。不要拿产区名当价格标签，也不要看到便宜的缅甸料就觉得捡漏。 缅甸料适合做什么 缅甸料的香韵清甜带药香，做手串、碎料、品香都合适。手串看油脂和品相，碎料看香韵和性价比，品香看上炉后的层次。 预算中等的话，缅甸碎料是很好的入门选择：香韵有特点，价格不离谱，上炉能闻出惠安系和星洲系之间的过渡风格。 买缅甸料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地。溯源说不清的，先别买。 第二，缅甸料的香韵介于两个体系之间，商家有时会按惠安系卖、有时按星洲系卖。按实际香韵判断，别纠结它属于哪个体系。 第三，亲自闻。清甜带药香是缅甸料的常见风格，闻着发闷、单一甜香、带化学味的，先别买。 适合什么人 喜欢清甜又想要一点厚重感的人，缅甸料是不错的选择。预算中等、想体验惠安系和星洲系之间风格的人，也可以从缅甸料入门。 日常品香、手串、碎料，缅甸料都能用。关键还是看具体那块料的香韵和油脂合不合你的口味。"},{"num":"15","title":"柬埔寨菩萨奇：凉意足，适合什么人","category":"产区","summary":"菩萨奇凉意突出、清甜带花香，适合喜欢清凉香韵的人。","minutes":5,"img":"images/article15_cover.jpg","text":"柬埔寨菩萨奇：凉意足，适合什么人 菩萨奇凉意突出、清甜带花香，适合喜欢清凉香韵的人。 产区 菩萨奇在柬埔寨菩萨省，是惠安系里以凉意见长的产区。清甜带花香，凉意足而持久，喜欢清凉香韵的人，一闻就忘不了。 菩萨奇在哪，香韵什么样 菩萨奇是柬埔寨菩萨省的地名，属于惠安系产区。香韵以凉意、清甜、花香为主，室温下就有明显凉意，上炉后凉意更突出，甜味跟在后面，尾调干净。 凉意是菩萨奇的招牌。和芽庄的清甜凉意比，菩萨奇的凉更直接、更持久；和奇楠的凉意比，菩萨奇的凉更温和、更日常。 油脂和外观 菩萨奇料的油线细腻，颜色棕褐，深浅过渡自然。好料油脂丰富，密度中等，香韵和油脂是挂钩的：油脂越丰富，凉意越足。 外观上，菩萨奇料的木质纹理清楚，油脂和木质交错。太黑发亮、油线像画上去的，要警惕泡油和染色。 菩萨奇的上炉表现 菩萨奇上炉之后，凉意最先出来，清凉透亮；温度升高后甜味跟上来，花香明显；尾调干净，没有杂味。建议从低温开始试，120 度、150 度、180 度各闻一次，凉意和甜味的变化很明显。 温度太高会糊，凉意会被糊味盖住。电熏炉低温慢品，才能闻到菩萨奇完整的层次。 适合什么人 喜欢清凉香韵的人，菩萨奇是很好的选择。夏天品香、提神醒脑、日常熏香，菩萨奇的凉意都很合拍。 喜欢醇厚药香的人，可能会觉得菩萨奇太凉、太清。这时候可以看看星洲系的料，或者缅甸料。口味没有对错，只有合不合适。 买菩萨奇要注意什么 第一，凉意可以造假。薄荷脑、冰片之类的物质也能做出凉意，但凉得发冲、发薄、持续短，和菩萨奇沉稳持久的凉完全不同。凉意要和成分检测一起看。 第二，产区名不能当真假证明。证书只证明材质，不证明产地。溯源说不清的，先别买。 第三，亲自闻。凉意足不清凉、甜味自不自然，闻一次就知道了。 菩萨奇和芽庄怎么选 两个产区都是惠安系，都是清甜凉意，差别在凉意的强度和香韵的细节：菩萨奇的凉更直接，芽庄的甜更明显。价格上，芽庄名气大，价格通常更高。 选哪个，看你的口味和预算。喜欢凉的选菩萨奇，喜欢甜的选芽庄，预算有限的先看菩萨奇。条件允许的话，两种碎料各买一点，对比着闻。"},{"num":"16","title":"老挝沉香：被低估的惠安系","category":"产区","summary":"老挝料香韵接近越南料，名气小，价格亲民，是惠安系的性价比之选。","minutes":5,"img":"images/article16_cover.jpg","text":"老挝沉香：被低估的惠安系 老挝料香韵接近越南料，名气小，价格亲民，是惠安系的性价比之选。 产区 老挝沉香是惠安系里被低估的一个：香韵接近越南料，清甜凉意、花香明显，但名气小，价格亲民。预算有限又想体验惠安系风格的人，老挝料值得看看。 老挝沉香的香韵 老挝料的香韵以清甜、凉意、花香为主，和越南料很接近。室温下清雅，上炉后层次分明，前调凉、尾调甜。很多老玩家盲闻都分不清老挝料和越南料。 香韵接近不是偶然：老挝和越南接壤，气候、土壤、树种都相似，结香条件也差不多。产区名不同，料子本身很像。 老挝的主要产地 老挝的沉香产地分布在北部、中部和南部，北部靠近中国云南，中部和南部靠近越南。不同地区的料香韵大同小异，都是清甜凉意、花香明显，细微差别要亲自闻。 产地内部也有品质差异，关键还是看具体那块料的油脂、香韵和品相。不要迷信某个具体地名，好料子不分南北。 为什么名气小 一是产量和流通量相对小，二是市场宣传少，三是越南料的名气太大，把周边产区都盖住了。名气小不等于品质差，只是知道的人少。 名气小也有好处：价格里没有多少品牌溢价，同样香韵和油脂的料，老挝料的价格通常明显低于芽庄料。 油脂和外观 老挝料的油线细腻自然，颜色棕褐，深浅过渡自然。好料油脂丰富，密度中等，香韵和油脂挂钩。 外观上，老挝料的木质纹理清楚，油脂和木质交错。太黑发亮、油线像画上去的，要警惕泡油和染色。 买老挝料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地。溯源说不清的，先别买。 第二，老挝料有时会被当成越南料卖，价格翻倍。买之前问清楚产地，别为借来的名字付钱。 第三，亲自闻。清甜凉意、花香明显是老挝料的常见风格，闻着发闷、单一甜香、带化学味的，先别买。 适合什么人 预算有限、想体验惠安系风格的人，老挝料是很好的入门选择。日常品香熏香，老挝料的性价比很高。 已经有经验的玩家，也可以在老挝料里找高品质的料子。名气小的产区，反而容易找到被低估的好料。"},{"num":"17","title":"海南沉香：蜜韵清雅，国产代表","category":"产区","summary":"海南白木香蜜韵清雅，是国产沉香的代表，野生料极少，种植料是主流。","minutes":6,"img":"images/article17_cover.jpg","text":"海南沉香：蜜韵清雅，国产代表 海南白木香蜜韵清雅，是国产沉香的代表，野生料极少，种植料是主流。 产区 海南沉香是国产沉香的代表，白木香种，蜜韵清雅。古代文人写沉香，写的大多是海南料。今天市面上的海南沉香，绝大多数是种植料，野生料极少，遇到“野生海南”要多留个心眼。 海南沉香的香韵 海南料的香韵以蜜韵、清雅、甜凉为主。室温下清甜，上炉后蜜香明显，层次干净，尾调悠长。喜欢清雅蜜韵的人，对海南料没有抵抗力。 海南料属于惠安系，和越南料风格接近，但蜜韵更突出。这是海南白木香的特点，也是它在历史上名气大的原因。 蜜韵是什么意思 蜜韵是品香圈里的说法，指沉香里那种像蜂蜜一样的甜香，甜而不腻，带一点花果香。海南料的蜜韵比较突出，上炉之后尤其明显。 蜜韵是香韵的描述，不是成分指标。不同的料蜜韵强弱不同，同一批料不同温度下蜜韵也不一样。亲自闻过，才知道蜜韵是什么感觉。 历史上的海南沉香 海南沉香在古代就是名香，宋元以来通过海上贸易运往中原，被文人、宫廷、寺庙使用。古籍里说的“琼州香”“海南香”，指的就是海南料。 历史名气大，也让海南料的价格里带了一部分品牌溢价。买之前想清楚，你买的是料子还是名字。 野生和种植，要分清 海南野生沉香经过多年采伐，存量极少，而且受保护。市面上绝大多数海南沉香是种植料：人工种植的白木香，经过结香、采收、加工，品质稳定，溯源清楚。 种植料不是假货。种植和野生是两种来源，不是真假的区分。好的种植料香韵、油脂都不差，而且来源合法、价格透明。遇到“野生海南”，要问合法手续，没有手续的所谓野生料，本身就是问题。 买海南料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地是海南。溯源说不清的，先别买。 第二，“野生”两个字要警惕。野生海南料极少，动不动就“野生”的，大概率是噱头。 第三，亲自闻。蜜韵清雅是海南料的招牌，闻着发闷、单一甜香、带化学味的，先别买。 适合什么人 喜欢清雅蜜韵、日常品香熏香的人，海南料是不错的选择。喜欢国产沉香、看重溯源和合法性的人，海南种植料是很好的选择。 预算有限的话，海南种植料的价格相对透明，入门体验不错。不必追求“野生”两个字，好料子不分野生种植。"},{"num":"18","title":"广东茂名电白：白木香，中国沉香之乡","category":"产区","summary":"茂名电白是白木香的重要产区，种植、加工、检测产业链完整，溯源相对容易。","minutes":6,"img":"images/article18_cover.jpg","text":"广东茂名电白：白木香，中国沉香之乡 茂名电白是白木香的重要产区，种植、加工、检测产业链完整，溯源相对容易。 产区 茂名电白在广东西南部，是中国沉香的重要产区，白木香种，清甜凉意。这里从种植、结香、加工到检测，产业链很完整。本 App 的作者团队就来自茂名种植园，这篇按中立原则写：只讲茂名料的特点，不排优劣。 茂名电白的沉香什么样 茂名电白的沉香是白木香种，属于惠安系。香韵以清甜、凉意、蜜韵为主，室温下清雅，上炉后层次干净，尾调甜凉。 油脂上，电白料的油线细腻自然，颜色棕褐，深浅过渡自然。好料油脂丰富，密度中等，香韵和油脂挂钩。 为什么叫中国沉香之乡 电白是中国沉香种植面积较大、产业链较完整的地区之一，从育苗、种植、结香、采收、加工到销售、检测，各个环节都有人在做。沉香产业是当地的重要产业。 电白沉香协会还参与制定了 T/DBCX 010-2025《奇楠沉香鉴定及质量分级》，这是国内奇楠鉴定的团体标准之一。 产业链完整，意味着什么 产业链完整的好处是溯源相对容易：从哪棵树、哪块地、哪年结香，到哪批加工、哪份检测报告，链条短，问得清。买家可以直接问到源头。 但产业链完整不等于每块料都好。茂名料里也有品质参差，买之前还是要看香韵、油脂、证书，一样的标准。 电白的沉香产业现状 电白的沉香产业从种植延伸到加工和销售：精油蒸馏、手串加工、线香制作、香材交易，各个环节都有企业在做。本地也有沉香市场和检测条件，买卖相对透明。 产业链完整不等于没有假货。电白市场上同样有泡油、染色、套证的料，买之前还是要按文章 01 的方法自查，看香韵、油脂、证书，一样的标准。 买茂名料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地是茂名。溯源说不清的，先别买。 第二，亲自闻。清甜凉意、蜜韵是茂名料的常见风格，闻着发闷、单一甜香、带化学味的，先别买。 第三，问检测。茂名本地有检测条件，正规商家应该能提供一物一证的 CMA 报告。提供不了的，先别买。 作者的话：为什么写这篇 本 App 由茂名种植园团队发起，作者从 2002 年起种沉香。写茂名这篇，不是为了推销自家料，而是因为了解得比较深，写得最实在。 内容上我们坚持中立：茂名料有自己的特点，也有自己的局限。产区没有高低之分，只有风格不同。选哪个产区，看你的口味和用途。"},{"num":"19","title":"广西、云南、福建：国内其他热门产区","category":"产区","summary":"广西、云南、福建都是白木香，香韵清甜凉意，国内溯源相对容易。","minutes":5,"img":"images/article19_cover.jpg","text":"广西、云南、福建：国内其他热门产区 广西、云南、福建都是白木香，香韵清甜凉意，国内溯源相对容易。 产区 除了海南和广东，广西、云南、福建也是国内热门的沉香产区。三个地方都是白木香种，香韵清甜凉意，属于惠安系。国内产区的共同好处是溯源相对容易，链条短，问得清。 广西：靠近广东，风格接近 广西的沉香以白木香为主，钦州、玉林、北海等地都有种植。香韵清甜凉意，和广东料很接近，油脂细腻，颜色棕褐。 广西料的价格相对亲民，入门体验不错。买之前一样要看香韵、油脂、证书，产区名不是真假证明。 云南：清甜带凉，产区在南部 云南的沉香主要在南部，西双版纳、普洱等地，气候湿热，适合白木香生长。香韵清甜带凉，带一点山野的清爽感。 云南料的产量相对小，市场上流通的不多。遇到云南料，亲自闻过再决定，溯源说不清的先别买。 福建：历史久，产量小 福建的沉香历史很久，漳州、莆田等地古代就有用香、制香的传统。现在福建的沉香以种植为主，产量相对小，香韵清甜。 福建料在市场上不多见，价格跨度也不小。买之前问清楚来源，亲自闻过再决定。 三个产区的共同点 一是都是白木香种，香韵清甜凉意，属于惠安系。二是都在国内，溯源相对容易，链条短。三是都有种植基地，种植料是主流，来源合法、价格透明。 共同点之外，每个产区也有自己的细微差别。香韵的差别要亲自闻，文字说不清楚。 三个产区，优先看哪个 预算有限想入门，先看广西料：价格亲民，香韵清甜凉意，入门体验不错。喜欢清爽山野风格的，可以看看云南料。看重历史和传统制香的，可以了解福建料。 三个产区的料香韵接近，差别主要在细微之处。优先看哪个，不如说优先看哪块料：亲自闻过、溯源清楚、价格合理的，就是好选择。 买国内产区的料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地。溯源说不清的，先别买。 第二，国内产区的料也有品质参差，不要觉得“国产就一定好”或“国产就不如进口”。看具体那块料的香韵和油脂。 第三，亲自闻。清甜凉意是这三个产区的常见风格，闻着发闷、单一甜香、带化学味的，先别买。"},{"num":"20","title":"印尼加里曼丹、达拉干：星洲系主力","category":"产区","summary":"加里曼丹醇厚药香，达拉干醇厚带凉意，是星洲系的主力产区。","minutes":6,"img":"images/article20_cover.jpg","text":"印尼加里曼丹、达拉干：星洲系主力 加里曼丹醇厚药香，达拉干醇厚带凉意，是星洲系的主力产区。 产区 加里曼丹和达拉干在印尼，是星洲系的主力产区。加里曼丹醇厚药香，达拉干醇厚里带一点凉意。喜欢浓郁厚重香韵的人，星洲系的料绕不开这两个地方。 加里曼丹在哪，香韵什么样 加里曼丹是东南亚的大岛，印尼部分占了大半，雨林茂密。加里曼丹沉香的香韵以醇厚、药香、木香为主，香味浓郁饱满，留香时间长。 上炉之后，加里曼丹料的香韵厚重绵长，前调醇、中调药香、尾调木香。喜欢浓郁香韵的人，会觉得它很过瘾。 达拉干有什么不一样 达拉干是加里曼丹东北部的一个岛，香韵在星洲系里比较特别：醇厚里带一点凉意，清甜感比加里曼丹本岛明显。喜欢醇厚、又想要一点清凉感的人，常常会看上达拉干。 达拉干的料油脂丰富，颜色偏深，密度较大。好料能沉水，香韵和油脂挂钩。 加里曼丹内部也有分区 加里曼丹很大，东部、西部、南部的料香韵有差别。西部料常带一点乳香、奶香，东部料醇厚药香更突出，南部料介于两者之间。这些是贸易圈里的常见说法，不是严格标准。 分区说法可以参考，但不要迷信。同一分区里也有品质差异，不同分区里也有风格接近的料。关键还是亲自闻，看具体那块料的香韵和油脂。 油脂和外观 星洲系的油脂往往比较丰富，颜色偏深，棕褐到深褐都有。油线自然，密度中等偏大。加里曼丹和达拉干的料都是这个路子。 外观上，星洲系料的木质纹理清楚，油脂和木质交错。太黑发亮、油线像画上去的，要警惕泡油和染色。深色不等于高油，要看油线是不是自然。 价格怎么看 加里曼丹和达拉干的价格跨度都很大：入门级的碎料不贵，顶级的老料也不便宜。达拉干因为名气大，同规格下价格通常高于加里曼丹本岛的料。 价格看的是具体那块料的油脂、香韵和品相，不是产区名。不要拿产区名当价格标签。 买星洲系的料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地是加里曼丹或达拉干。溯源说不清的，先别买。 第二，深色不等于高油。星洲系料颜色偏深，但太黑发亮的反而要警惕泡油和染色。 第三，亲自闻。醇厚药香是加里曼丹的招牌，醇厚带凉是达拉干的招牌。闻着发闷、单一甜香、带化学味的，先别买。 适合什么人 喜欢浓郁厚重香韵的人，加里曼丹是不错的选择。喜欢醇厚、又想要一点凉意的人，可以看看达拉干。 做手串、雕件，星洲系的料油脂丰富、颜色深沉，很合拍。日常品香熏香，星洲系的留香长，也很适合。"},{"num":"21","title":"马来西亚：星洲系的醇厚代表","category":"产区","summary":"马来西亚料醇厚药香带乳香，是星洲系的重要产区。","minutes":6,"img":"images/article21_cover.jpg","text":"马来西亚：星洲系的醇厚代表 马来西亚料醇厚药香带乳香，是星洲系的重要产区。 产区 马来西亚在东南亚群岛，是星洲系的重要产区。香韵醇厚药香，带一点乳香、奶香，油脂丰富，颜色偏深。喜欢浓郁厚重香韵的人，马来西亚料是绕不开的选择。 马来西亚沉香的香韵 马来西亚料的香韵以醇厚、药香、乳香为主，香味浓郁饱满，留香时间长。上炉后香韵厚重绵长，前调醇、中调药香、尾调带一点乳香的甜润。 西马和东马的料香韵有差异：西马料的乳香、奶香比较明显，东马料的药香更突出。买之前亲自闻，别只看产区名。 油脂和外观 马来西亚料的油脂比较丰富，颜色偏深，棕褐到深褐都有。油线自然，密度中等偏大，好料能沉水。 外观上，马来西亚料的木质纹理清楚，油脂和木质交错。太黑发亮、油线像画上去的，要警惕泡油和染色。深色不等于高油，要看油线是不是自然。 西马和东马有什么不同 西马是马来半岛，东马是加里曼丹岛北部的沙巴、砂拉越。西马料常带乳香、奶香，香韵相对柔和；东马料药香更浓，香韵更厚重。 这些是贸易圈里的常见说法，不是严格标准。同一地区里也有品质差异，不同地区里也有风格接近的料。关键还是亲自闻，看具体那块料的香韵和油脂。 价格怎么看 马来西亚料的价格跨度很大：入门级的碎料不贵，顶级的老料也不便宜。总体上，同规格下马来西亚料的价格通常低于达拉干等名气更大的产区。 价格看的是具体那块料的油脂、香韵和品相，不是产区名。不要拿产区名当价格标签。 买马来西亚料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地。溯源说不清的，先别买。 第二，深色不等于高油。星洲系料颜色偏深，但太黑发亮的反而要警惕泡油和染色。 第三，亲自闻。醇厚药香带乳香是马来西亚料的常见风格，闻着发闷、单一甜香、带化学味的，先别买。 适合什么人 喜欢浓郁厚重香韵的人，马来西亚料是不错的选择。喜欢乳香、奶香的人，可以重点看看西马料。 做手串、雕件，马来西亚料油脂丰富、颜色深沉，很合拍。日常品香熏香，留香长，也很适合。"},{"num":"22","title":"文莱：小产区，香韵细腻","category":"产区","summary":"文莱料产量小，香韵细腻干净，醇厚里带一点清甜。","minutes":5,"img":"images/article22_cover.jpg","text":"文莱：小产区，香韵细腻 文莱料产量小，香韵细腻干净，醇厚里带一点清甜。 产区 文莱在加里曼丹岛北部，是星洲系里的小产区。产量不大，但香韵细腻干净，醇厚里带一点清甜，喜欢星洲系又不想要太浓重的人，常常会看上文莱料。 文莱沉香的香韵 文莱料的香韵以醇厚、细腻为主，带一点清甜。室温下香味干净，上炉后层次分明，前调醇、尾调甜，没有杂味。 和加里曼丹的浓郁药香比，文莱料更细腻、更干净；和惠安系的清甜凉意比，文莱料更醇厚。处在中间的风格，是它突出的特点。 油脂和外观 文莱料的油脂细腻，颜色棕褐，深浅过渡自然。好料油脂丰富，密度中等，香韵和油脂挂钩。 外观上，文莱料的木质纹理清楚，油脂和木质交错。太黑发亮、油线像画上去的，要警惕泡油和染色。 为什么产量小 文莱国土面积小，沉香树的分布有限，产量一直不大。加上出口管理严格，市场上流通的文莱料不多。 产量小也意味着价格不便宜。文莱料的价格跨度同样很大，入门级的碎料和顶级的老料，价格能差很多倍。 买文莱料要注意什么 第一，产区名不能当真假证明。证书只证明材质，不证明产地是文莱。溯源说不清的，先别买。 第二，文莱料有时会被其他星洲系料冒充。买之前问清楚产地，别为借来的名字付钱。 第三，亲自闻。细腻干净、醇厚带清甜是文莱料的常见风格，闻着发闷、单一甜香、带化学味的，先别买。 文莱料和加里曼丹料怎么选 文莱料和加里曼丹料都是星洲系，差别在香韵的细腻程度：文莱料更细腻干净，加里曼丹料更浓郁厚重。喜欢清爽一点的选文莱，喜欢浓郁一点的选加里曼丹。 价格上，文莱料产量小，同规格下通常高于加里曼丹料。预算有限的话，先看加里曼丹料；追求细腻风格的话，可以看看文莱料。条件允许的话，两种碎料各买一点，对比着闻。 适合什么人 喜欢星洲系的醇厚、又不想要太浓重的人，文莱料是不错的选择。日常品香熏香，文莱料的细腻干净很合拍。 预算有限的话，不必非买文莱。加里曼丹、马来西亚的料香韵接近，选择更多，价格也更灵活。"},{"num":"23","title":"沉香怎么保存：防潮、防晒、防串味","category":"保存","summary":"沉香保存三原则：防潮、防晒、防串味，密封罐加阴凉处就够了。","minutes":6,"img":"images/article23_cover.jpg","text":"沉香怎么保存：防潮、防晒、防串味 沉香保存三原则：防潮、防晒、防串味，密封罐加阴凉处就够了。 保存 沉香买回家，保存不当香味会越来越淡。记住三个原则：防潮、防晒、防串味。方法不复杂，一个密封罐加阴凉处，就能解决大部分问题。 防潮：沉香怕水怕潮 沉香是木质，长期受潮会发霉、变味，甚至长虫。保存的地方要干燥，湿度别太高。南方梅雨季节尤其要注意，密封罐里可以放一小包干燥剂。 如果沉香不小心沾了水，不要暴晒、不要用吹风机热风吹。放在阴凉通风处自然阴干，干透了再收起来。 防晒：阳光会让香味变淡 阳光直射会让沉香的香气成分挥发变质，颜色也会变浅。保存的地方要避光，窗台、阳台、车里都不是好地方。 密封罐放在柜子里、抽屉里就行。玻璃罐透光，最好再套个盒子或者放在暗处。 防串味：沉香会吸味道 沉香的木质疏松，容易吸收周围的味道。香水、樟脑、咖啡、香料、烟味，都会串进沉香里。保存的时候要单独存放，远离气味重的东西。 不同产区的沉香也要分开保存。惠安系和星洲系的料放在一起，时间长了香韵会互相影响，品香的时候就分不清了。 用什么容器 密封玻璃罐是常见的选择，密封好、不串味、看得见。陶瓷罐也可以，避光性好。木盒好看，但密封性差，适合短期存放，不适合长期保存。 塑料袋、塑料盒不推荐。塑料本身有味道，时间长了会串进沉香里。密封罐的盖子要拧紧，每次取完及时盖好。 不同形态的保存要点 碎料、香材：密封罐，阴凉干燥处，不同产区分开。手串：单独放，不戴的时候收进密封袋或小盒子。精油：避光、密封、恒温，见文章 26。线香香粉：密封、防潮，见文章 27。 不管哪种形态，保存的核心都一样：干燥、避光、密封、单独存放。做到这四点，沉香的香味能保持很久。 保存多久，香味会变吗 保存得当的沉香，香味不会越放越淡，反而会慢慢醇化，香韵更沉稳。这和陈年老料的道理一样：时间让香韵更融合。 但醇化不等于放着不管。定期检查一下：有没有受潮、有没有串味、有没有虫蛀。发现问题及时处理，见文章 24。"},{"num":"24","title":"沉香串味了怎么办","category":"保存","summary":"串味的沉香先隔离，再通风散味，严重的用低温熏蒸，洗不得。","minutes":5,"img":"images/article24_cover.jpg","text":"沉香串味了怎么办 串味的沉香先隔离，再通风散味，严重的用低温熏蒸，洗不得。 保存 沉香串味是常见的保存事故：和香水、樟脑、咖啡放一起，香味就变了。串味了别慌，先隔离，再慢慢散味，大多数情况能救回来。 先判断：串的是什么味 闻一闻，串进来的味道是什么：香水味、樟脑味、烟味、霉味，还是其他沉香的味道。不同的串味，处理方法不一样。 轻微串味：本味还在，杂味淡淡的。严重串味：本味被盖住，杂味很明显。先判断轻重，再决定怎么处理。 第一步：隔离 立刻把串味的沉香单独拿出来，放在干净的密封罐里，和其他沉香分开。不要继续和串味源放在一起，越放串得越深。 同时检查其他沉香：有没有也被串味。串味会传染，一块串味的料放在罐子里，整罐都会受影响。 第二步：通风散味 轻微串味，放在阴凉通风处，每天打开罐子透透气，杂味会慢慢散掉。这个过程要几天到几周，别着急。 通风的时候不要晒太阳，不要放在风口吹。阴凉、通风、干燥，三个条件都要满足。 严重串味怎么办 严重串味可以试试低温熏蒸：电熏炉调到最低温度，放一小块料，低温加热几分钟，让杂味先挥发掉。温度别高，高了会把本味也烧掉。 如果串味源是霉味，要先检查有没有发霉。发霉的料要单独处理，霉斑擦掉、阴干，再按上面的方法散味。霉得很严重的料，香韵已经坏了，救回来的意义不大。 串味能预防吗 能。串味的预防比处理容易：单独存放、密封罐、远离气味重的东西，做到这三点，基本不会串味。 新买的沉香到家，先闻一闻有没有串味。运输过程中和香水、樟脑放一起，也会串味。发现串味，越早处理越好，串得越深越难散。 这些方法不能用 不能用水洗：沉香沾水会发霉、变味，越洗越糟。不能用酒精擦：酒精会溶解油脂，香味直接没了。不能暴晒：阳光会让香气成分变质。 也不能用香水、精油去盖：杂味加杂味，最后什么味都不是。串味只能靠散，不能靠盖。"},{"num":"25","title":"手串日常保养：盘、戴、放","category":"保存","summary":"手串保养三件事：盘要轻柔，戴要避水避化学品，放要密封单独。","minutes":6,"img":"images/article25_cover.jpg","text":"手串日常保养：盘、戴、放 手串保养三件事：盘要轻柔，戴要避水避化学品，放要密封单独。 保存 沉香手串是贴身的东西，保养得好越戴越润，保养不当香味越来越淡。记住三个字：盘、戴、放，各有讲究。 盘：轻柔，别用力 新买的手串可以先盘几天：用干净的棉布，轻轻擦拭珠子表面，把浮尘和加工残留擦掉。盘的时候别用力，沉香质地软，用力会留下划痕。 盘的目的是清洁和抛光，不是包浆。沉香手串不需要盘出包浆，盘得太狠反而会把油脂盘掉，香味变淡。 戴：避水、避化学品、避硬物 戴手串的时候避开水：洗手、洗澡、游泳、下雨，都先摘下来。沉香沾水会发霉、变味，干了之后香味也会变淡。 避开化学品：香水、洗手液、护手霜、酒精，都不要直接接触手串。喷香水的时候先摘手串，干了再戴。 避开硬物：沉香质地软，磕碰会留下痕迹。运动、干活的时候先摘下来，放好。 放：密封、单独、阴凉 不戴的时候，把手串收进密封袋或小盒子里，单独存放，不要和其他手串、香材混放。沉香会串味，混放时间长了香韵会变。 存放的地方要阴凉干燥，避开阳光和潮湿。抽屉、柜子都可以，窗台、卫生间不行。 手串脏了怎么办 日常灰尘：干布轻轻擦掉就行。沾了汗：干布擦干，放在阴凉处透透气，干了再收起来。 沾了水：立刻用干布吸干，放在阴凉通风处自然阴干，不要暴晒、不要用吹风机。干透了再戴。 沾了化学品：干布擦掉，通风散味。化学品渗进去的，香味可能已经受影响，散味要一段时间。 手串的绳子怎么保养 手串的绳子也是消耗品：弹力绳用久了会松、会断。发现绳子松了，及时换绳，别等断了珠子散一地。 换绳的时候顺便检查珠子：有没有裂、有没有掉油线。换绳可以自己换，也可以找商家换，成本不高。 手串香味变淡了，正常吗 正常。手串戴在手上，香味会慢慢挥发，闻着越来越淡。这是沉香的自然规律，不是假货。 想恢复香味：把手串放进密封袋，密封几天，香味会重新聚起来。或者用电熏炉低温熏一下珠子旁边的碎料，闻一闻本味还在不在。 香味变淡和串味是两回事：变淡是本味弱了，串味是杂味进来了。串味的处理见文章 24。"},{"num":"26","title":"精油怎么保存：避光、密封、恒温","category":"保存","summary":"精油怕光怕热怕空气，避光、密封、恒温是三原则，开封后尽快用完。","minutes":5,"img":"images/article26_cover.jpg","text":"精油怎么保存：避光、密封、恒温 精油怕光怕热怕空气，避光、密封、恒温是三原则，开封后尽快用完。 保存 沉香精油是沉香的浓缩，香气成分比木材更娇贵。保存不当，香味会氧化变质。记住三个原则：避光、密封、恒温。 避光：光是精油的大敌 阳光和强光会让精油的香气成分氧化、变质，颜色变深、香味变酸。精油瓶通常是深色玻璃，就是为了避光。 平时把精油放在柜子、抽屉里，不要放在窗台、桌面上晒太阳。深色瓶也不是万能的，避光存放才是根本。 密封：空气会让精油氧化 精油接触空气会氧化，香味越来越淡，最后变味。每次用完立刻盖紧瓶盖，不要长时间敞口放着。 滴管用完要插回去，瓶口擦干净再盖。瓶口残留的精油氧化后会发黏，影响密封。 恒温：怕热怕冷 精油怕热：高温会让香气成分挥发、变质。不要放在暖气、灶台、车里。室温存放就可以，15 到 25 度比较合适。 精油也怕冷：温度太低会凝固、分层。不要放冰箱冷藏室，冷冻更不行。室温、阴凉、稳定，是比较合适的环境。 开封后多久用完 开封后的精油，接触空气的次数越多，氧化越快。建议开封后尽快用完，不要囤着不用。 如果一次买得多，可以分装成小瓶：大瓶密封存着，小瓶日常用，减少大瓶开盖的次数。分装的瓶子要干净、干燥、避光。 精油的瓶子有什么讲究 精油瓶通常是深色玻璃：避光、不和精油起反应。不要把精油倒进塑料瓶，塑料会和精油起反应，香味变质。 滴管瓶用起来方便，但滴管每次都会带进空气。用完立刻盖紧，减少开盖次数。如果瓶子破了，尽快换干净的深色玻璃瓶分装。 精油变质了怎么判断 闻一闻：香味变酸、发闷、带刺激味，可能是氧化变质了。看一看：颜色明显变深、变浑浊，也可能是变质。 变质的精油不要继续用在皮肤上。变质是不可逆的，保存得当才能避免。"},{"num":"27","title":"线香、香粉怎么保存","category":"保存","summary":"线香香粉怕潮怕串味，密封、防潮、避光，不同香分开存放。","minutes":5,"img":"images/article27_cover.jpg","text":"线香、香粉怎么保存 线香香粉怕潮怕串味，密封、防潮、避光，不同香分开存放。 保存 线香和香粉是沉香的加工品，比原木更怕潮、更怕串味。保存的方法和原木差不多，但有几个地方要特别注意。 防潮要特别注意 线香和香粉受潮之后，点不着、香味发闷，严重的会发霉。南方梅雨季节尤其要注意，密封容器里可以放一小包干燥剂。 线香受潮了可以阴干：放在阴凉通风处，干透了再收起来。香粉受潮结块，阴干后轻轻捏散，还能用。 密封、防串味 线香和香粉的表面积大，更容易吸收周围的味道。保存的时候要密封，远离香水、樟脑、咖啡这些气味重的东西。 不同产区、不同配方的线香香粉要分开存放，混放时间长了香韵会互相影响。 线香怎么放 线香要直立存放，不要平放压着。平放时间长了容易折断、变形。专用的线香筒、香盒都可以，密封性好就行。 线香很细，容易断。取用的时候轻拿轻放，不要一把抓。断掉的线香碎段可以收集起来，用电熏炉熏着用，别浪费。 香粉怎么放 香粉要放在密封罐里，盖子拧紧。香粉颗粒细，受潮结块、串味都比线香更快。 取用香粉的时候用干净干燥的勺子，不要用湿手、湿勺子。每次取完立刻盖好，减少接触空气的时间。 线香的香味和配料有关 线香的香味和配料直接相关：纯沉香粉做的线香，香味干净；加了其他香料、粘粉的线香，香味会受配料影响。买之前看配料表，配料越简单，香味越纯。 香粉也一样：纯沉香粉和混合香粉是两回事。商家应该说得清配料，说不清的先别买。配料表是判断线香香粉品质的重要依据。 保质期怎么看 线香和香粉没有固定的保质期，保存得当可以放很久。判断标准是香味：闻着香味还在、没有霉味、没有串味，就能用。 香味明显变淡、发霉、串味严重的，就不要用了。保存得当，才能放得久。"},{"num":"28","title":"品香入门：电熏炉、隔片、用量","category":"品香","summary":"品香入门三件套：电熏炉、隔片、少量碎料，从低温开始试。","minutes":6,"img":"images/article28_cover.jpg","text":"品香入门：电熏炉、隔片、用量 品香入门三件套：电熏炉、隔片、少量碎料，从低温开始试。 品香 品香没有想象中复杂：一个电熏炉、一张隔片、一小块碎料，就能开始。入门的关键是低温、少量、慢慢闻，别一上来就大火猛烧。 需要什么设备 电熏炉是常见的品香设备：温度可调，干净方便，适合入门。传统香炉、炭炉也可以，但温度不好控制，新手容易烧糊。 隔片是放在炉子上、碎料下面的小金属片，作用是隔开碎料和热源，让香味慢慢出来，不直接烧糊。云母片、不锈钢片都可以。 其他工具：小镊子、小勺子、香盘。入门不用买全套，电熏炉加隔片就够了。 碎料放多少 入门用量：一小块碎料，米粒到黄豆大小就够了。放多了香味太浓，反而闻不出层次。 碎料要切薄一点，薄片受热均匀，香味出来得快。太厚的块受热不均，外面糊了里面还没出味。 温度从低温开始 建议从 120 度开始试，闻一闻，再升到 150 度、180 度。不同温度下，香韵的层次不一样：低温出凉意和花香，中温出甜香，高温出醇厚。 温度太高会糊，糊味会把香韵盖住。宁可低温多闻几次，不要一次烧糊。温度分段的详细讲法，见文章 29。 怎么闻 品香的时候，把手放在炉子上方，轻轻把香味拢向鼻子，不要凑太近猛吸。猛吸会刺激鼻子，闻不出层次。 每次闻几秒，停一停，再闻。鼻子会疲劳，连续闻太久就闻不出差别了。闻完一种，喝口水、透透气，再闻下一种。 第一次品香，选什么料 第一次品香，建议选惠安系的碎料：清甜凉意，上炉层次清楚，低温段就能闻出味道。星洲系的料香味浓，新手容易闻不出层次。 不用买贵的料入门。入门级的碎料就够了，先把品香的方法练熟，再慢慢试不同的产区和等级。 入门常见错误 一次放太多料：香味太浓，闻不出层次。温度太高：烧糊了，全是糊味。凑太近猛吸：刺激鼻子，什么都闻不出。 连续闻太多：鼻子疲劳，后面闻什么都一样。心急：品香是慢功夫，低温、少量、慢慢闻，才能闻出层次。"},{"num":"29","title":"电熏炉温度怎么调：120-220 度分段","category":"品香","summary":"电熏炉温度分段闻：120 度凉意，150 度甜香，180 度醇厚，220 度收尾。","minutes":6,"img":"images/article29_cover.jpg","text":"电熏炉温度怎么调：120-220 度分段 电熏炉温度分段闻：120 度凉意，150 度甜香，180 度醇厚，220 度收尾。 品香 电熏炉的好处是温度可调。不同温度下，沉香的香韵层次完全不同。分段升温，一块料能闻出四五个层次。 为什么要分段升温 沉香的香气成分在不同温度下挥发：低温挥发的是轻的成分，凉意、花香；中温挥发的是甜香；高温挥发的是醇厚、木香。 一次烧到高温，只能闻到混合的味道，层次全没了。分段升温，每一段闻到的都不一样，一块料的价值才能闻出来。 120 度：凉意和花香 120 度是入门温度，凉意和花香最先出来。惠安系的料在这个温度表现很好：清甜凉意、花香明显。 这个温度下香味清淡，适合静静闻。不要着急升温，先把低温的层次闻清楚。 150 度：甜香 升到 150 度，甜香开始出来，蜜韵、花果香比较明显。海南料的蜜韵在这个温度很突出。 150 度是很多料的黄金温度：香味饱满，层次清楚，不容易糊。新手可以在这个温度多停一会。 180 度：醇厚 180 度，醇厚、药香、木香出来了。星洲系的料在这个温度表现很好：浓郁饱满，留香长。 这个温度下香味比较浓，闻的时间别太长。闻几秒，停一停，再闻。 220 度：收尾，别超过 220 度是收尾温度，香韵的最后层次：木香、焦糖香。超过 220 度容易糊，糊味会把所有香韵盖住。 收尾之后，碎料基本烧透了，换一块新的。不要反复烧同一块，烧透的料再烧只有糊味。 电熏炉用完怎么清理 电熏炉用完要及时清理：隔片上的残渣倒掉，炉面用干布擦干净。残渣留在炉面上，下次加热会糊，影响香味。 清理的时候等炉子凉透再动手，别烫着手。炉子不用的时候收好，防尘防潮。 不同产区的温度建议 惠安系的料：低温段多停留，120、150 度是重点，凉意和花香在低温段。星洲系的料：中高温段多停留，180、220 度是重点，醇厚和药香在高温段。 这只是参考，具体看那块料的表现。同一产区的不同料，温度表现也有差别。亲自试过，才知道每块料适合哪个温度。"},{"num":"30","title":"沉香碎料怎么用：熏、泡、磨粉","category":"品香","summary":"碎料三种用法：电熏炉熏香、泡水、磨粉，各有讲究。","minutes":6,"img":"images/article30_cover.jpg","text":"沉香碎料怎么用：熏、泡、磨粉 碎料三种用法：电熏炉熏香、泡水、磨粉，各有讲究。 品香 沉香碎料是常见的形态，用法也多：熏、泡、磨粉。三种用法各有讲究，用对了，一小块碎料能玩出很多花样。 熏：常见的用法 电熏炉熏香是常见的用法：碎料切薄，放在隔片上，低温开始，分段升温。详细讲法见文章 28 和 29。 传统香炉、炭炉也可以熏，但温度不好控制，新手容易烧糊。入门建议用电熏炉。 泡：泡水闻香 沉香碎料可以泡水：取一小块碎料，放在杯子里，倒入热水，香味会慢慢出来。泡水主要闻香，不是喝药，沉香没有药用功效，不要当药喝。 泡过水的碎料阴干之后还能熏，不要扔掉。泡水的水温不要太高，80 度左右比较合适，太烫会把香味冲散。 磨粉：做线香、香粉 碎料可以磨粉：用研磨机、石臼，把碎料磨成粉。香粉可以用来做线香，也可以直接用电熏炉熏。 磨粉的时候要注意：碎料要干燥，受潮的碎料磨不成粉。磨好的香粉要密封保存，见文章 27。 碎料怎么选 熏香用：选油脂丰富、香韵好的碎料，切薄一点。泡水用：选香韵清雅的碎料，惠安系的比较合适。磨粉用：选边角料、碎块，性价比高。 不同用途选不同的料，不要拿好料去磨粉，也不要拿差料去熏香。物尽其用，才是玩沉香的态度。 碎料和整块料有什么区别 碎料是加工、切割剩下的边角料，香韵和整块料一样，只是形态小。品香、泡水、磨粉，碎料都够用，性价比比整块料高。 整块料适合收藏、雕刻、做摆件。日常品香用碎料就行，没必要买整块料来熏。买碎料的时候一样要看油脂、香韵和证书。 碎料的边角料别浪费 切薄片剩下的边角料、碎屑，都可以收集起来：磨粉、熏香、泡水，都能用。沉香不便宜，边角料也是料。 收集起来的碎屑要密封保存，不同产区的分开，别串味。"},{"num":"31","title":"新手买沉香，先避开这 5 个坑","category":"选购","summary":"新手买沉香的 5 个常见坑：只看颜色、迷信沉水、轻信产区、不要证书、贪便宜。","minutes":7,"img":"images/article31_cover.jpg","text":"新手买沉香，先避开这 5 个坑 新手买沉香的 5 个常见坑：只看颜色、迷信沉水、轻信产区、不要证书、贪便宜。 选购 新手买沉香，交学费是常事。但有些坑完全可以避开：只看颜色、迷信沉水、轻信产区、不要证书、贪便宜。这 5 个坑，避开了就少花很多冤枉钱。 坑一：只看颜色，越黑越好 很多人以为沉香越黑越好，其实不是。天然沉香的颜色有深有浅，太黑发亮的反而要警惕泡油和染色。颜色只是参考，油线、香韵、密度要一起看。 泡油的料颜色均匀发黑，油线像画上去的；天然料颜色深浅过渡自然，油线不规则。只看颜色买，很容易买到泡油货。 坑二：迷信沉水，沉水就是好 沉水只说明密度大，不等于香韵好。有些沉水的料香韵一般，有些浮水的料香韵很好。沉水和品质没有必然关系。 更要注意：有些商家往料里注胶、压粉，人为增加密度，让浮水料变成沉水料。沉水可以造假，香韵和证书造不了假。 坑三：轻信产区名 芽庄、达拉干、菩萨奇这些名气大的产区，价格也高，冒充的也多。产区名不能当真假证明，证书只证明材质，不证明产地。 买之前问清楚溯源：产地、批次、结香方式能不能说清。说不清的，先别买。产区名是参考，不是保证。 坑四：不要证书，凭感觉买 没有证书的沉香，等于没有身份。证书至少要能证明材质是沉香属，优先 CMA + CNAS 检测机构。 证书还要和实物一一对应：编号、批次、照片能不能对上。批量通用证书等于没证。证书的详细讲法，见文章 03。 坑五：贪便宜，低价捡漏 沉香的成本摆在那里：结香要几年到几十年，好料稀缺。价格明显低于市场水平的，基本有问题：泡油、染色、假料，或者根本不是沉香。 新手买沉香，先从入门级的碎料开始，熟悉香韵和市场，再慢慢升级。不要一上来就买贵的，也不要贪便宜买来路不明的。 新手买沉香的正确顺序 先学再买：把真假鉴别（文章 01–10）和产区（文章 11–22）看一遍，心里有数再下手。 先小后大：先买入门级的碎料、手串，熟悉了再买贵的。先问再买：证书、溯源、退换政策问清楚了再付款。"},{"num":"32","title":"手串怎么选？尺寸、克重、配珠、孔道","category":"选购","summary":"手串选购看 4 点：尺寸合手腕，克重看油脂，配珠别喧宾夺主，孔道要光滑。","minutes":7,"img":"images/article32_cover.jpg","text":"手串怎么选？尺寸、克重、配珠、孔道 手串选购看 4 点：尺寸合手腕，克重看油脂，配珠别喧宾夺主，孔道要光滑。 选购 手串是新手入门常见的选择。选手串看 4 点：尺寸、克重、配珠、孔道。每一项都有讲究，选对了戴着舒服，选错了花钱还闹心。 尺寸：合手腕 手串的尺寸指珠子的直径，常见的有 8mm、10mm、12mm、14mm。手腕细的人选 8–10mm，手腕粗的人选 12–14mm。尺寸要合手腕，太大太小都不好看。 尺寸也影响价格：同品质下，大尺寸的珠子用的料更多，价格更高。不要为了大尺寸牺牲品质，品质比尺寸重要。 克重：看油脂 克重是手串重量的参考：同尺寸下，克重越大，油脂越丰富，密度越大。但克重不是唯一标准，香韵和油线也要看。 注意：克重可以造假。注胶、压粉的手串克重虚高，戴着没香味。克重要和香韵、油线、证书一起看，单独看克重没意义。 配珠：别喧宾夺主 配珠是手串上搭配的装饰珠：隔珠、顶珠、佛头。配珠的作用是点缀，不要喧宾夺主。配珠的材质要和沉香协调，颜色别太跳。 配珠的品质也要看：劣质配珠会掉色、会磨损沉香珠。买手串的时候问清楚配珠的材质，别为配珠多付钱。 孔道：要光滑 孔道是珠子中间穿绳的孔。好的孔道光滑、居中，没有毛刺和裂纹。孔道粗糙、偏孔、开裂的手串，戴着容易断绳，珠子也容易裂。 检查孔道：把珠子对着光看，孔道里有没有杂质、胶水。注胶的手串孔道里常有胶水残留，闻着有化学味。 珠子要匀称 一串手串的珠子要大小匀称、颜色接近。珠子大小不一、颜色差异大的，可能是拼凑的料，品质不稳定。 天然沉香的珠子不可能完全一样，轻微的色差是正常的。但色差太大、油线风格完全不同的，就要警惕拼凑。 买手串的检查清单 闻一闻：室温下有没有香味，上炉香韵怎么样。看一看：油线自然吗，孔道光滑吗，珠子匀称吗。问一问：证书、溯源、退换政策。 手串的保养见文章 25。买之前先看真假鉴别（文章 01、06），心里有数再下手。"},{"num":"33","title":"精油怎么选？看批次、看检测报告、看留香","category":"选购","summary":"精油选购看 3 点：批次要稳定，检测报告要对得上，留香要持久自然。","minutes":6,"img":"images/article33_cover.jpg","text":"精油怎么选？看批次、看检测报告、看留香 精油选购看 3 点：批次要稳定，检测报告要对得上，留香要持久自然。 选购 精油是沉香的浓缩，选购的门道和原木不一样。看 3 点：批次、检测报告、留香。每一项都关系到你买到的精油是不是真货、好不好用。 看批次：稳定性 精油是按批次蒸馏的：同一批次的精油，香韵、颜色、浓度应该一致。不同批次之间有轻微差异是正常的，但差异太大就要问清楚。 买精油的时候问批次号：批次号能不能和检测报告对上。批次号对不上的，可能是混批、贴牌，或者根本没有检测。 看检测报告：一物一证 精油的检测报告要和批次一一对应：报告上的批次号、检测项目、检测机构能不能对上。优先 CMA + CNAS 检测机构。 检测报告要看什么：沉香四醇含量（≥0.1% 是硬指标，见文章 03），有没有掺假、稀释。报告看不懂可以问商家，商家应该讲得清。 看留香：持久自然 好的沉香精油留香持久：滴在试香纸上，几小时后还能闻到香味，香韵层次分明。留香短、香味单一的，可能是稀释过的，或者根本不是沉香精油。 留香也要自然：香味慢慢变淡，层次慢慢变化。香味突然消失、或者一直一个味道的，都要警惕。 看颜色和质地 沉香精油的颜色从淡黄到深褐都有，不同产区、不同批次颜色不一样。颜色深浅不是品质标准，太黑、太浑浊的反而要警惕。 质地：沉香精油比较浓稠，滴在纸上扩散慢。太稀、像水一样的，可能是稀释过的。 买之前先试用 买精油之前先试用：滴在试香纸上，闻一闻前调、中调、尾调的变化。试香纸上留香几小时，香韵层次分明，才是好精油。 先买小瓶：不确定合不合自己，先买小瓶试用。合用再买大瓶，不合用也不浪费。不要一上来就买大瓶贵的。 精油的价格怎么看 精油的价格看的是原料、工艺、批次：好料蒸馏的精油成本高，价格也高。价格明显低于市场水平的，基本有问题：稀释、掺假、贴牌。 不要为包装付钱：精油的价值在瓶子里的油，不在瓶子和盒子。精油的保存见文章 26。"},{"num":"34","title":"线香怎么选？配料、燃烧时间、烟大小","category":"选购","summary":"线香选购看 3 点：配料越简单越好，燃烧时间要稳定，烟要小而淡。","minutes":6,"img":"images/article34_cover.jpg","text":"线香怎么选？配料、燃烧时间、烟大小 线香选购看 3 点：配料越简单越好，燃烧时间要稳定，烟要小而淡。 选购 线香是日常品香方便的形式。选购看 3 点：配料、燃烧时间、烟大小。每一项都关系到你闻到的香味纯不纯、舒不舒服。 看配料：越简单越好 线香的配料直接决定香味：纯沉香粉做的线香，香味干净；加了其他香料、粘粉的线香，香味会受配料影响。买之前看配料表，配料越简单，香味越纯。 商家应该说得清配料：沉香粉的产区、比例，粘粉是什么，有没有助燃剂。说不清的先别买。配料表是判断线香品质的重要依据。 看燃烧时间：要稳定 好的线香燃烧时间稳定：同一批线香，每支烧的时间应该差不多。燃烧时间忽长忽短的，可能是配料不均匀，或者受潮了。 燃烧时间也和粗细有关：粗的线香烧得久，细的烧得快。买之前问清楚一支大概烧多久，心里有数。 看烟大小：小而淡 好的线香烟小而淡：点燃后烟不多，香味干净。烟大、呛鼻的线香，可能是加了助燃剂，或者配料有问题。 烟的颜色也有讲究：白烟、淡烟是正常的，黑烟、黄烟要警惕。烟大不等于香味浓，烟小才是好线香的表现。 闻香味：干净自然 点燃线香闻一闻：香味干净、自然，层次分明。香味刺鼻、单一甜香、带化学味的，先别买。 线香的香味和原木的香味有差别：线香是加工品，香味会受配料和燃烧影响。不要拿线香的香味和原木直接比。 线香的粗细怎么选 线香有粗有细：粗的燃烧时间长，香味浓；细的燃烧时间短，香味淡。新手先从细的开始，香味不浓，容易接受。 粗细也影响价格：粗的线香用的料多，价格高。不要为了粗牺牲品质，品质比粗细重要。 线香的保存 线香怕潮怕串味：密封、防潮、避光，不同产区、配方的分开存放。线香直立放，不要平放压着。详细的保存方法见文章 27。 受潮的线香点不着、香味发闷。买回家先检查：有没有受潮、有没有串味。"},{"num":"35","title":"沉香怎么选作礼物","category":"选购","summary":"沉香送礼分三档：入门、中阶、收藏，按场合和关系选，只讲档位逻辑。","minutes":6,"img":"images/article35_cover.jpg","text":"沉香怎么选作礼物 沉香送礼分三档：入门、中阶、收藏，按场合和关系选，只讲档位逻辑。 选购 沉香送礼有讲究：送对了是心意，送错了是负担。按场合和关系分三档：入门、中阶、收藏。每一档适合的人和场合都不一样。 入门档：日常心意 入门档适合日常送礼：朋友生日、同事乔迁、节日问候。选入门级的碎料、线香、小手串，实用、不贵重，对方没有负担。 入门档的关键是实用：对方能用得上、用得着。不要送对方用不上的东西，再贵也是负担。 中阶档：重要场合 中阶档适合重要场合：长辈寿辰、重要客户、结婚贺礼。选手串、精油、线香礼盒，品质要好，包装要得体。 中阶档的关键是体面：品质过硬，证书齐全，包装得体。送礼之前先了解对方的喜好：喜欢手串还是精油，喜欢什么香韵。 收藏档：特殊关系 收藏档适合特殊关系：至亲、恩师、重要合作伙伴。选收藏级的原木、老料、大件雕件，有收藏价值，有纪念意义。 收藏档的关键是稀缺：好料稀缺，有收藏价值。买之前先了解市场，问清楚证书和溯源，不要为虚名付钱。 送礼的注意事项 第一，了解对方：对方喜不喜欢沉香，懂不懂沉香。不懂沉香的人，送再贵的东西也体会不到价值。 第二，证书齐全：送礼的沉香证书要齐全，一物一证。对方收到礼物，能查到证书，才放心。 第三，别送假货：送礼送到假货，比不送还糟糕。买之前先看真假鉴别（文章 01–10），心里有数再下手。 送礼的时机 送礼的时机也很重要：生日、节日、乔迁、寿辰，不同的场合送不同的档位。场合对了，礼物才有意义。 不要临时抱佛脚：送礼之前先了解对方的喜好，提前准备。临时买的礼物，容易买错、买贵。 送礼的包装 包装要得体：不要过度包装，也不要太简陋。沉香的包装以简洁、素雅为主，木盒、纸盒都可以，颜色别太花哨。 包装里可以附一张卡片：写清楚产地、批次、保存方法。对方收到礼物，知道怎么保存、怎么用，才是完整的礼物。"},{"num":"36","title":"沉香的价格是怎么定的","category":"选购","summary":"沉香的价格看 4 点：油脂、产区、稀缺性、工艺，四个因素一起定价。","minutes":7,"img":"images/article36_cover.jpg","text":"沉香的价格是怎么定的 沉香的价格看 4 点：油脂、产区、稀缺性、工艺，四个因素一起定价。 选购 沉香的价格跨度很大：入门级的碎料不贵，收藏级的老料很贵。价格是怎么定的？看 4 点：油脂、产区、稀缺性、工艺。四个因素一起定价，缺一不可。 油脂：决定性因素 油脂是沉香价格的决定性因素：油脂越丰富，香韵越浓，价格越高。油脂的多少看油线：油线密集、自然，价格高；油线稀疏、断断续续，价格低。 油脂的多少也和结香时间有关：结香时间越长，油脂越丰富。但结香时间不是唯一因素，树种、环境、受伤方式都有影响。 产区：名气影响价格 产区的名气影响价格：芽庄、达拉干这些名气大的产区，同品质下价格更高。但产区名不是品质保证，同一产区里也有品质差异。 不要为产区名多付钱：价格看的是具体那块料的油脂、香韵和品相，不是产区名。产区名是参考，不是价格标签。 稀缺性：物以稀为贵 沉香的稀缺性是价格的重要因素：好料稀缺，结香要几年到几十年，野生的越来越少。稀缺的东西，价格自然高。 但稀缺不等于好：稀缺的料香韵不一定好，常见的料香韵不一定差。稀缺是价格因素，不是品质标准。 工艺：加工的价值 工艺影响价格：手串的打磨、雕件的雕工、精油的蒸馏工艺，都有成本。工艺好的产品，价格更高。 工艺的价值在细节：手串的孔道光滑、珠子匀称，雕件的线条流畅、比例协调。工艺粗糙的产品，再好的料也卖不上价。 价格的陷阱 第一，虚高定价：有些商家把价格定得很高，再打折卖，营造捡漏的感觉。不要被原价迷惑，看实际成交价。 第二，低价陷阱：价格明显低于市场水平的，基本有问题：泡油、染色、假料。不要贪便宜。 第三，故事定价：有些商家讲故事卖沉香：百年老树、深山野料。故事不能当价格依据，看料子本身。 怎么判断价格合不合理 多看多比：看不同的商家、不同的料，对比价格和品质。心里有数了，再下手。 问清楚：油脂、产区、稀缺性、工艺，每一项都问清楚。商家应该讲得清，讲不清的先别买。"},{"num":"37","title":"奇楠和沉香，到底差在哪","category":"进阶","summary":"奇楠和沉香差在结香方式、油脂形态和香韵：奇楠是沉香里的特殊变异，油脂软、香韵凉。","minutes":7,"img":"images/article37_cover.jpg","text":"奇楠和沉香，到底差在哪 奇楠和沉香差在结香方式、油脂形态和香韵：奇楠是沉香里的特殊变异，油脂软、香韵凉。 进阶 奇楠和沉香，很多人分不清。其实奇楠是沉香里的一种特殊变异：结香方式不同，油脂形态不同，香韵也不同。差在哪，一次讲清楚。 结香方式不同 沉香是树受伤后，慢慢分泌树脂、结香，几年到几十年。奇楠也是树受伤后结香，但结香的过程不同：奇楠的树脂分泌更活跃，油脂更丰富，质地更软。 奇楠的形成条件更苛刻：不是每棵沉香树都能结出奇楠。奇楠的产量比沉香少得多，这也是奇楠价格高的原因之一。 油脂形态不同 奇楠的油脂是软的：用手捏能留下指甲印，削下来的碎屑能捏成团。沉香的油脂是硬的：质地坚硬，削下来是碎屑，捏不成团。 奇楠的油脂颜色偏深，油光发亮；沉香的油脂颜色深浅不一，油线自然。油脂的软硬是区分奇楠和沉香的重要标志。 香韵不同 奇楠的香韵以凉意为主：室温下就能闻到凉意，上炉后凉意更明显，层次分明。沉香的香韵以醇厚、甜香为主，凉意相对弱。 奇楠的凉意是独特的：清凉、通透，没有杂味。沉香的凉意相对含蓄，需要上炉才能闻出来。 价格差很多 奇楠的价格比沉香高得多：产量少、形成条件苛刻、香韵独特。但价格高不等于适合每个人，奇楠的凉意不是每个人都喜欢。 买奇楠要特别小心：市面上的假奇楠很多，泡油、染色、普通沉香冒充奇楠。奇楠真假的详细讲法，见文章 09。 奇楠和沉香，选哪个 喜欢凉意的选奇楠：奇楠的凉意独特，喜欢凉意的人会很喜欢。不喜欢凉意的选沉香：沉香的香韵更丰富，选择更多。 预算有限的话，先买沉香：沉香的价格更灵活，选择更多。奇楠的价格高，新手不必一上来就买奇楠。 奇楠的鉴定标准 奇楠的鉴定有团体标准：T/DBCX 010-2025《奇楠沉香鉴定及质量分级》，2025 年 12 月 1 日起实施。标准里规定了奇楠的鉴定方法和质量分级。 买奇楠的时候问证书：证书能不能证明是奇楠，检测机构是不是 CMA + CNAS。证书只证明材质，不证明产地和等级。"},{"num":"38","title":"沉香是怎么形成的","category":"进阶","summary":"沉香是树受伤后分泌树脂、慢慢结香的结果，从受伤到结香要几年到几十年。","minutes":6,"img":"images/article38_cover.jpg","text":"沉香是怎么形成的 沉香是树受伤后分泌树脂、慢慢结香的结果，从受伤到结香要几年到几十年。 进阶 沉香不是树木本身，是树受伤后分泌的树脂和木质混合、慢慢结成的。从受伤到结香，要几年到几十年。时间，是沉香形成的关键。 第一步：树受伤 沉香的形成从受伤开始：风折、虫蛀、雷击、人为砍伤，树皮破损，木质暴露。受伤是结香的起点，没有受伤，就没有沉香。 受伤的方式影响结香：自然受伤结的香，和人工造伤结的香，香韵和油脂有差别。但都是沉香，区别在品质，不在真假。 第二步：分泌树脂 树受伤后，会分泌树脂来保护伤口、防止感染。树脂慢慢渗透进木质，和木纤维混合，颜色变深，香味慢慢出来。 树脂的分泌是持续的：伤口越大、时间越长，树脂分泌越多，油脂越丰富。但树脂分泌也受树种、环境、气候影响。 第三步：慢慢结香 树脂和木质混合后，慢慢氧化、醇化，香韵越来越浓，油脂越来越丰富。这个过程要几年到几十年，时间越长，香韵越醇厚。 结香的时间不是越长越好：时间太长，木质会腐朽，香韵反而变差。结香的时间要适中，香韵和油脂达到平衡。 野生和人工，有什么区别 野生沉香是自然受伤、自然结香，时间长、产量少、价格高。人工沉香是人工造伤、人工管理，时间短、产量大、价格低。 野生和人工的区别在时间和产量，不在真假。人工沉香也是真沉香，只要结香方式合规、检测达标。不要迷信野生，也不要轻视人工。 结香的几种方式 土沉：树倒在土里，木质腐朽，树脂留下来，香韵醇厚。倒架：树倒在地上，自然结香。水沉：树沉在水里，木质腐朽，树脂留下来。 不同的结香方式，香韵和油脂有差别：土沉醇厚，倒架清雅，水沉凉意足。但这些是贸易圈里的说法，不是严格标准。 沉香形成的时间 从受伤到结香，短的几年，长的几十年。结香时间的长短看树种、环境、受伤方式。时间越长，油脂越丰富，香韵越醇厚。 买沉香的时候问结香时间：商家应该说得清。说不清的先别买。结香时间是判断沉香品质的重要参考。"},{"num":"39","title":"沉香 3000 年：香文化简史","category":"进阶","summary":"沉香在中国用了三千多年：从祭祀用香，到文人用香，再到今天的收藏品香。","minutes":7,"img":"images/article39_cover.jpg","text":"沉香 3000 年：香文化简史 沉香在中国用了三千多年：从祭祀用香，到文人用香，再到今天的收藏品香。 进阶 沉香在中国用了三千多年：从祭祀用香，到文人用香，再到今天的收藏品香。三千年的历史，沉香的地位一直在变，但香味一直没变。 先秦：祭祀用香 沉香最早用于祭祀：先秦时期，人们焚香祭天、祭祖，沉香是祭祀用的香料之一。沉香的香味被认为能通神、能洁净。 先秦的沉香主要来自南方：岭南、海南的沉香通过贸易运到中原。沉香在当时是稀缺品，只有贵族才能用。 汉唐：香文化兴起 汉唐时期，香文化兴起：沉香从祭祀走向日常生活，文人、官员开始用香。香炉、香盒、香囊成为文人的日常用品。 唐代的沉香贸易很发达：通过海上丝绸之路，东南亚的沉香运到中国。中国的沉香文化开始影响日本、朝鲜。 宋元：文人用香的高峰 宋代是文人用香的高峰：苏轼、黄庭坚这些文人都爱香、写香。沉香成为文人雅趣的象征，品香成为文人的日常。 宋代的香文化很讲究：香的种类、用法、器具都有讲究。沉香在宋代的地位很高，是文人身份的象征。 明清：香文化普及 明清时期，香文化普及：沉香从文人走向民间，普通人也开始用香。香铺、香市出现，沉香的交易越来越活跃。 明清的沉香贸易规模很大：东南亚的沉香大量运到中国，中国的沉香文化也传到东南亚。 今天：收藏与品香 今天的沉香：收藏、品香多种用途。沉香的价格越来越高，好料越来越少。沉香从日常用品变成了收藏品。 今天的沉香文化：既有传统的品香，也有现代的收藏。沉香的香味没变，但人们用香的方式变了。 沉香的贸易路线 沉香的贸易路线主要是海上丝绸之路：东南亚的沉香通过海运到中国，再从中国运到日本、朝鲜。陆上丝绸之路也有沉香贸易，但规模小。 沉香的贸易路线影响了香文化：不同产区的沉香通过贸易进入中国，中国的香文化也通过贸易传到世界各地。"},{"num":"40","title":"买沉香要懂的法律与术语","category":"进阶","summary":"沉香受 CITES 附录 II 管制，进出口要许可；附新手术语表 20 个词。","minutes":8,"img":"images/article40_cover.jpg","text":"买沉香要懂的法律与术语 沉香受 CITES 附录 II 管制，进出口要许可；附新手术语表 20 个词。 进阶 买沉香要懂法：沉香属植物受 CITES 附录 II 管制，进出口要许可。国内买卖也要合规。懂法，才能买得放心。文末附新手术语表 20 个词。 CITES 附录 II 是什么 CITES 是《濒危野生动植物种国际贸易公约》，沉香属植物列入附录 II：国际贸易受管制，需要进出口许可证。附录 II 不是禁止贸易，是管制贸易。 附录 II 的意思是：沉香属植物如果不加管制，可能面临灭绝风险。国际贸易需要证明来源合法、有许可证，才能进行。 进出口要许可 沉香进出口需要许可证：出口国和进口国都要发证。没有许可证的沉香进出口是违法的，可能被没收、罚款。 个人携带沉香出入境也要注意：少量自用可以携带，但数量、用途要合规。大批量携带要申报、要许可。 国内买卖要合规 国内买卖沉香要合规：人工种植的沉香可以买卖，野生沉香的买卖受限制。买之前问清楚来源：人工还是野生，有没有合法手续。 野生沉香的买卖要特别小心：没有合法手续的野生沉香，买卖是违法的。不要为来路不明的野生沉香付钱。 怎么买才合规 第一，问来源：人工还是野生，有没有合法手续。第二，问证书：检测报告、产地证明能不能对上。第三，留凭证：发票、合同、证书都留好。 合规购买的沉香，来源清楚、手续齐全、凭证完整。买之前问清楚，买之后留凭证，才能买得放心。法规会变化，买卖之前查一下最新的规定。 新手术语表：怎么用 术语表在下面的对照表里：20 个新手常遇到的词，每个词一句话解释。买沉香的时候遇到不懂的词，查一下就明白了。 术语表不是标准定义，是通俗解释。遇到商家用术语忽悠你，查一下术语表，心里有数。"}];

      '<div><div><span class="num">' + a.num + '</span> <span class="t">' + escHtml(a.title) + '</span></div>' +
      '<div class="s">' + escHtml(a.summary) + '</div></div></a>';
  }).join("") : '<div class="card secondary">没有找到相关文章，换个词试试。</div>';
}
function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function setCat(btn){ curCat = btn.getAttribute("data-cat");
  document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
  btn.classList.add("active"); render(); }
function doSearch(){ render(); }
function clearKw(){ document.getElementById("kw").value = ""; render(); }
render();
</script>
